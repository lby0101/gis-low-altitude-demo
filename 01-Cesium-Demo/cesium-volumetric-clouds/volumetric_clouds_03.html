<!doctype html>
<html lang="en">

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>体积云 03 · 场景遮挡</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>

  <body>
    <div id="app">
      <div id="cesiumContainer"></div>
    </div>

    <script type="module">
      const { createApp } = Vue;
      import GUI from "https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.js";

      // ============================================================
      // 体积云 03 · 场景遮挡
      //
      // 前两篇做完，云的形状没问题了，但只要场景里有建筑就露馅：
      // **不管楼在云前面还是后面，云一律盖在最上层。**
      //
      // 因为合成是无条件的：
      //     out_FragColor = mix(sceneColor, cloudColor, cloudAlpha)
      // 云的 alpha 只来自密度累加，完全没做深度判断。
      //
      // 这一篇补上「场景深度测试」：
      //   1. 从 depthTexture 还原场景表面沿视线的距离
      //   2. 在步进循环里记下云的**前表面**距离
      //   3. 谁近谁显 —— 场景比云前表面近，就把云淡出
      //
      // 和第 1 篇的「地面遮挡」是同一件事的推广：
      // 那次用的是解析的地球球面，这次用的是真实的场景深度
      // （地形 / 3D Tiles / 建筑全都在里面）。
      //
      // 参考实现：cesium-volumetric-clouds（MIT）
      // ============================================================

      /** 云壳球心处的「基准半径」，源库的取值 */
      const BOTTOM_RADIUS = 6360000;

      const CLOUD_SHADER = `
uniform sampler2D colorTexture;
// ===== 本篇新增：场景深度 =====
// PostProcessStage 会自动绑定这一张 —— 它是**当前帧**的深度，
// 包含地形、3D Tiles、建筑等所有不透明物体。
uniform sampler2D depthTexture;
in vec2 v_textureCoordinates;

// —— 相机 ——（全部在「球坐标系」里：原点 = 云壳球心）
uniform vec3  u_cameraPositionSphere;
uniform vec3  u_cameraDirection;
uniform vec3  u_cameraRight;
uniform vec3  u_cameraUp;
uniform vec2  u_tanHalfFov;

// —— 云壳 ——
uniform float u_bottomRadius;
uniform float u_minHeight;     // 云底高度（相对基准半径）
uniform float u_maxHeight;     // 云顶高度

// —— 步进 ——
uniform float u_stepCount;
uniform float u_maxDistance;

// —— 密度 ——
uniform float u_densityScale;
uniform float u_coverage;
uniform vec3  u_cloudColor;

// ===== 本篇新增：形状噪声 =====
// 两张预计算的 3D 噪声纹理，都用 WebGL2 的 sampler3D 采样
uniform highp sampler3D shapeTexture;        // 128³  Perlin-Worley，管轮廓
uniform highp sampler3D shapeDetailTexture;  // 32³   Worley fbm，管细节
uniform float u_shapeRepeat;          // 形状纹理的平铺密度
uniform float u_shapeDetailRepeat;    // 细节纹理的平铺密度
uniform float u_shapeAmount;          // 形状噪声的影响强度
uniform float u_shapeDetailAmount;    // 细节侵蚀的强度
uniform float u_shapeAlteringBias;    // 高度梯度的偏置（越小云越「上重下轻」）
uniform float u_coverageFilterWidth;  // 覆盖率的过渡宽度
uniform float u_profileLinear;        // 层内剖面的线性项
uniform float u_profileConstant;      // 层内剖面的常数项

// ===== 本篇新增：场景遮挡 =====
uniform float u_depthTestEnabled;     // 0 / 1
uniform float u_occlusionBandScale;   // 软化带宽度（占云前表面距离的比例）
uniform float u_debugSceneDepth;      // 1 = 把场景深度可视化

// 注意：out_FragColor 由 Cesium 的 PostProcessStage 自动声明，
// 这里再写一遍会报 'out_FragColor' : redefinition。

// ------------------------------------------------------------
// 射线与球求交。
// 返回 (近交点, 远交点)；没打中返回 (-1, -1)。
// 要求 dir 已归一化。
// 推导：把 |o + t*d| = r 展开成 t² + 2(o·d)t + (o·o - r²) = 0
//       记 b = o·d，c = o·o - r²，则 t = -b ± sqrt(b² - c)
// ------------------------------------------------------------
vec2 raySphereIntersection(vec3 rayOrigin, vec3 rayDirection, float radius) {
  float b = dot(rayOrigin, rayDirection);
  float c = dot(rayOrigin, rayOrigin) - radius * radius;
  float h = b * b - c;
  if (h < 0.0) {
    return vec2(-1.0);
  }
  h = sqrt(h);
  return vec2(-b - h, -b + h);
}

// ------------------------------------------------------------
// 射线是否打中地球（球心在原点，地面半径 = u_bottomRadius）。
// 不做这个判断的话，相机在云层之下、视线朝下时，射线会穿过地球、
// 从**另一侧**再次进入云层所在的半径区间 —— 结果就是「地面以下有云」。
// ------------------------------------------------------------
bool rayIntersectsGround(vec3 rayOrigin, vec3 rayDirection) {
  float r = length(rayOrigin);
  float mu = dot(rayOrigin, rayDirection) / r;
  return mu < 0.0 && r * r * (mu * mu - 1.0) + u_bottomRadius * u_bottomRadius >= 0.0;
}

// ------------------------------------------------------------
// 【本篇核心】从深度纹理还原场景表面的视空间深度。
//
// 两个要点：
//   1. 深度值要**直接读 .r**，不要 czm_unpackDepth ——
//      PostProcessStage 绑的是场景原始的深度模板纹理，
//      不是 Cesium 内部那种打包成 RGBA 的格式。
//   2. 用 czm_windowToEyeCoordinates 还原，它会自动处理
//      对数深度 / 线性深度两种情况，不用自己判断。
//
// 天空区域没有场景几何，深度接近 1.0，判为无效。
// 不排除它的话，整片天空都会被当成「被遮挡」。
// ------------------------------------------------------------
float readSceneEyeDepth(vec2 uv, out bool valid) {
  float depthOrLogDepth = texture(depthTexture, uv).r;
  valid = depthOrLogDepth > 1e-7 && depthOrLogDepth < 1.0 - 1e-7;
  if (!valid) {
    return 0.0;
  }
  vec4 positionEC = czm_windowToEyeCoordinates(gl_FragCoord.xy, depthOrLogDepth);
  float eyeDepth = -positionEC.z / positionEC.w;
  valid = eyeDepth > 0.0 && eyeDepth == eyeDepth;   // 最后一项排除 NaN
  return valid ? eyeDepth : 0.0;
}

// ------------------------------------------------------------
// 工具：把 x 从 [min1, max1] 重映射到 [0, 1] 并夹紧
// ------------------------------------------------------------
float remapClamped(float x, float min1, float max1) {
  return clamp((x - min1) / (max1 - min1), 0.0, 1.0);
}

// ------------------------------------------------------------
// 【本篇核心 ①】半圆变换 —— 高度梯度
//
//   biased = hf^bias       bias < 1 时曲线往右推，云「上重下轻」
//   x      = biased*2 - 1  映射到 [-1, 1]
//   1 - x²                半圆
//
// 结果：hf = 0 和 hf = 1 处都是 0，中间鼓起。
// bias 默认 0.35 —— 云底比较平、云顶收得圆，接近真实积云的观感。
//
// 这一步解决的是上一篇「云是上下一样粗的柱子」的问题。
// ------------------------------------------------------------
float shapeAlteringFunction(float heightFraction, float bias) {
  float biased = pow(heightFraction, bias);
  float x = clamp(biased * 2.0 - 1.0, -1.0, 1.0);
  return 1.0 - x * x;
}

// ------------------------------------------------------------
// 层内密度剖面。源库用四个系数描述（exp 项 / 指数 / 线性项 / 常数项），
// 默认退化成线性：0.75 * hf + 0.25
// ------------------------------------------------------------
float getLayerDensity(float heightFraction) {
  return u_profileLinear * heightFraction + u_profileConstant;
}

// ------------------------------------------------------------
// 密度场。输入是球坐标系下的位置。
//
// 五步，把「均匀一团」一步步雕成云：
//   ① 高度梯度  —— 底部和顶部密度为 0
//   ② 覆盖率    —— 决定「有云 / 没云」
//   ③ 形状噪声  —— Perlin-Worley 3D 纹理，管轮廓
//   ④ 细节侵蚀  —— 高频 Worley 把边缘啃碎
//   ⑤ 密度剖面  —— 层内再做一次线性加权
// ------------------------------------------------------------
float densityAt(vec3 positionSphere) {
  float height = length(positionSphere) - (u_bottomRadius + u_minHeight);
  float hf = clamp(height / (u_maxHeight - u_minHeight), 0.0, 1.0);

  // ① 高度梯度
  float heightScale = shapeAlteringFunction(hf, u_shapeAlteringBias);

  // ② 覆盖率。源库这里采样天气纹理，本篇先用常数 1.0 代替，
  //    第 4 篇会把它换成真正的天气图。
  float factor = 1.0 - u_coverage * heightScale;
  float base = remapClamped(1.0, factor, factor + u_coverageFilterWidth);

  // ③ 【本篇核心 ②】Perlin-Worley 形状
  //    shape.bin 是 128³ 的 R8 单通道纹理，采样就是一次三线性插值
  //    （硬件免费做的，不用自己写）
  float shape = texture(shapeTexture, positionSphere * u_shapeRepeat).r;
  float density = remapClamped(base, (1.0 - shape) * u_shapeAmount, 1.0);

  // ④ 细节侵蚀。32³ 的 Worley fbm 纹理。
  //    顶部用 pow(detail, 6) —— 只有很少的地方能通过，显得蓬松
  //    底部用 1 - detail     —— 反过来，显得絮状
  //    中间按 hf 在两者之间插值
  float detail = texture(shapeDetailTexture, positionSphere * u_shapeDetailRepeat).r;
  float modifier = mix(pow(detail, 6.0), 1.0 - detail, remapClamped(hf, 0.2, 0.4));
  modifier = mix(0.0, modifier, u_shapeDetailAmount);
  density = remapClamped(density * 2.0, modifier * 0.5, 1.0);

  // ⑤ 剖面
  density *= getLayerDensity(hf);

  return clamp(density * u_densityScale, 0.0, 1.0);
}

void main(void) {
  vec4 sceneColor = texture(colorTexture, v_textureCoordinates);

  // —— 1. 从像素坐标构造世界空间视线方向 ——
  vec2 ndc = v_textureCoordinates * 2.0 - 1.0;
  vec3 rayDirection = normalize(
    u_cameraDirection +
    u_cameraRight * (ndc.x * u_tanHalfFov.x) +
    u_cameraUp    * (ndc.y * u_tanHalfFov.y)
  );

  // —— 2. 和云壳求交，拿到进出云层的区间 ——
  float innerRadius = u_bottomRadius + u_minHeight;
  float outerRadius = u_bottomRadius + u_maxHeight;

  vec3 origin = u_cameraPositionSphere;
  float cameraRadius = length(origin);

  vec2 outerHit = raySphereIntersection(origin, rayDirection, outerRadius);
  // 两个判断缺一不可：
  //   outerHit.y <= 0  →  交点全在相机背后。相机在球外、视线朝上时就是这种情况，
  //                       球在身后。只判「有没有实根」是不够的。
  if (outerHit.y <= 0.0) {
    out_FragColor = sceneColor;
    return;
  }

  vec2 innerHit = raySphereIntersection(origin, rayDirection, innerRadius);
  bool hitsGround = rayIntersectsGround(origin, rayDirection);

  float tNear;
  float tFar;
  if (cameraRadius > outerRadius) {
    // 相机在云层之上：从穿入外球开始
    tNear = max(outerHit.x, 0.0);
    // 如果视线会打到内球，就在那儿结束（穿出云底）；否则到外球背面
    tFar = innerHit.x > 0.0 ? innerHit.x : outerHit.y;
  } else if (cameraRadius > innerRadius) {
    // 相机就在云层里：从眼前开始
    tNear = 0.0;
    tFar = innerHit.x > 0.0 ? innerHit.x : outerHit.y;
  } else {
    // 相机在云层之下。
    // 视线朝下时射线会扎进地里 —— 这时看不到云，直接返回原色。
    // （不返回的话，射线会从地球另一侧穿回云层半径区间，画出「地下的云」）
    if (hitsGround) {
      out_FragColor = sceneColor;
      return;
    }
    tNear = max(innerHit.y, 0.0);
    tFar = outerHit.y;
  }

  tFar = min(tFar, tNear + u_maxDistance);
  if (tFar <= tNear) {
    out_FragColor = sceneColor;
    return;
  }

  // —— 3. 等距步进，累加密度 ——
  float stepLength = (tFar - tNear) / u_stepCount;
  float transmittance = 1.0;
  vec3 scattered = vec3(0.0);
  // ===== 本篇新增：云的前表面距离（沿视线、从相机算起）=====
  float cloudFrontDepth = -1.0;

  for (float i = 0.0; i < 512.0; i += 1.0) {
    if (i >= u_stepCount) break;

    float t = tNear + (i + 0.5) * stepLength;
    vec3 positionSphere = origin + rayDirection * t;

    float density = densityAt(positionSphere);
    if (density > 0.0) {
      // 第一次采到密度，就是云的「前表面」
      if (cloudFrontDepth < 0.0) cloudFrontDepth = t;

      // 这一小段的「光学厚度」= 消光系数 × 密度 × 步长
      // 0.003 是调出来的：密度 1、路径 1.5km 时约 99% 不透明
      float sampleTransmittance = exp(-density * stepLength * 0.003);
      // 能量守恒：这一段散射进来的光 = 吸收掉的量
      scattered += transmittance * (1.0 - sampleTransmittance) * u_cloudColor;
      transmittance *= sampleTransmittance;
      if (transmittance < 0.01) break;   // 已经不透光了，提前退出
    }
  }

  vec3 cloudColor = scattered;
  float cloudAlpha = 1.0 - transmittance;

  // ===== 本篇新增：场景深度测试 =====
  bool depthValid = false;
  float sceneEyeZ = readSceneEyeDepth(v_textureCoordinates, depthValid);

  if (u_debugSceneDepth > 0.5) {
    // 调试视图：场景深度可视化（近处暗、远处亮、天空纯白）
    out_FragColor = vec4(vec3(depthValid ? fract(sceneEyeZ * 1e-4) : 1.0), 1.0);
    return;
  }

  if (u_depthTestEnabled > 0.5 && depthValid && cloudFrontDepth > 0.0) {
    // eyeZ 是「沿相机朝向」的深度，换算成「沿这条视线」的距离
    float sceneAlongRay =
      sceneEyeZ / max(dot(rayDirection, u_cameraDirection), 1e-5);

    // 软化带：在云前表面附近留一条过渡，避免轮廓出现硬锯齿。
    // 取距离的 2%，最少 50m。
    float band = max(50.0, cloudFrontDepth * u_occlusionBandScale);
    float visible = smoothstep(
      cloudFrontDepth - band,
      cloudFrontDepth + band,
      sceneAlongRay
    );
    cloudAlpha *= visible;
  }

  out_FragColor = vec4(mix(sceneColor.rgb, cloudColor, cloudAlpha), sceneColor.a);
}
`;

      createApp({
        data() {
          return {
            viewer: null,
            imageryLayer: null,
            cloudStage: null,
            tileset: null,
            statusText: "",
            scratch: {},
            // ===== 本篇新增：两张预计算的 3D 噪声纹理 =====
            volumeTextures: { shape: null, shapeDetail: null },
            params: {
              // 云层
              baseHeight: 1200,
              thickness: 1800,
              densityScale: 1.0,
              coverage: 0.22,
              cloudColor: "#ffffff",
              // 步进
              stepCount: 64,
              maxDistance: 40000,
              // ===== 本篇新增：形状 =====
              shapeAmount: 1.0,
              shapeRepeat: 0.00003,
              shapeDetailAmount: 0.35,
              shapeDetailRepeat: 0.003,
              shapeAlteringBias: 0.35,
              profileLinear: 0.75,
              profileConstant: 0.25,
              // ===== 本篇新增：场景遮挡 =====
              depthTest: true,
              occlusionBandScale: 0.02,
              debugSceneDepth: false,
            },
          };
        },
        async mounted() {
          this.initMap();
          this.loadTileset();
          // ===== 本篇新增：3D 噪声纹理必须先就绪，再挂后处理 =====
          await this.loadNoiseTextures();
          this.addClouds();
          this.addlilgui();
        },
        beforeUnmount() {
          if (this.myLilGui) {
            this.myLilGui.destroy();
            this.myLilGui = null;
          }
        },
        methods: {
          initMap() {
            let viewer = new Cesium.Viewer("cesiumContainer", {
              baseLayer: false,
              animation: false,
              timeline: false,
              fullscreenButton: false,
              infoBox: false,
              geocoder: false,
              homeButton: false,
              sceneModePicker: false,
              baseLayerPicker: false,
              navigationHelpButton: false,
              selectionIndicator: false,
              shouldAnimate: true,
            });

            window.viewer = viewer;
            viewer.scene.debugShowFramesPerSecond = true;
            viewer.scene.globe.enableLighting = false;
            viewer.scene.fog.enabled = false;
            viewer.scene.skyAtmosphere.show = true;
            viewer._cesiumWidget._creditContainer.style.display = "none";

            let imageryLayer = viewer.imageryLayers.addImageryProvider(
              new Cesium.UrlTemplateImageryProvider({
                url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                maximumLevel: 18,
              }),
            );

            this.viewer = viewer;
            this.imageryLayer = imageryLayer;

            // 相机放在云层之上，略微俯视 —— 能同时看到云顶和地平线
            viewer.camera.setView({
              destination: Cesium.Cartesian3.fromDegrees(116.4, 39.9, 7000),
              orientation: {
                heading: Cesium.Math.toRadians(0),
                pitch: Cesium.Math.toRadians(-17),
                roll: 0,
              },
            });
            return viewer;
          },
          async loadTileset() {
            try {
              this.statusText = "正在加载 3D Tiles 白模…";
              this.tileset = await Cesium.Cesium3DTileset.fromUrl(
                "../data/tileset/baimo/tileset.json",
                {
                  maximumScreenSpaceError: 16,
                  maximumMemoryUsage: 2048,
                },
              );
              this.viewer.scene.primitives.add(this.tileset);
              await this.viewer.zoomTo(this.tileset);
              this.statusText = "模型加载完成。";
            } catch (error) {
              console.warn("3D Tiles 加载失败：", error);
              this.statusText = `3D Tiles 加载失败：${error.message}`;
            }
          },

          /**
           * 每帧算一次「云壳球心」。
           *
           * 这个球要满足：半径固定为 BOTTOM_RADIUS，且与椭球在**相机的地面投影点**
           * 处相切。所以球心 = 地面点 - 法线 * BOTTOM_RADIUS。
           *
           * 直观理解：球心会落在离地心很近的地方，整个球几乎是「以地心为球心、
           * 半径 6360km」的一个球，只是沿法线挪了一点，好让球面正好压在地面点上。
           * 这样云层高度就永远相对「脚下的地面」来算。
           */
          computeSphereCenter() {
            const s = this.scratch;
            const ellipsoid = this.viewer.scene.globe.ellipsoid;
            const cameraPosition = this.viewer.camera.positionWC;

            if (!s.carto) s.carto = new Cesium.Cartographic();
            if (!s.surface) s.surface = new Cesium.Cartesian3();
            if (!s.normal) s.normal = new Cesium.Cartesian3();
            if (!s.center) s.center = new Cesium.Cartesian3();

            const carto = Cesium.Cartographic.fromCartesian(
              cameraPosition,
              ellipsoid,
              s.carto,
            );
            carto.height = 0;
            const surface = Cesium.Cartographic.toCartesian(
              carto,
              ellipsoid,
              s.surface,
            );
            const normal = ellipsoid.geodeticSurfaceNormal(surface, s.normal);

            const center = Cesium.Cartesian3.multiplyByScalar(
              normal,
              BOTTOM_RADIUS,
              s.center,
            );
            Cesium.Cartesian3.subtract(surface, center, center);

            // 相对相机的位置（球坐标系里的相机位置 = 球心 - 相机位置 取反）
            const centerRelative = Cesium.Cartesian3.subtract(
              center,
              cameraPosition,
              s.centerRelative || (s.centerRelative = new Cesium.Cartesian3()),
            );
            return Cesium.Cartesian3.negate(
              centerRelative,
              s.cameraPositionSphere ||
                (s.cameraPositionSphere = new Cesium.Cartesian3()),
            );
          },

          /**
           * ===== 本篇新增 =====
           * 加载预计算的 3D 噪声纹理。
           *
           * 两个 .bin 都是**裸 R8 数据**，没有文件头：
           *   shape.bin        128³ = 2,097,152 字节
           *   shape_detail.bin  32³ =    32,768 字节
           *
           * 用 Cesium.Texture3D 上传，着色器里用 sampler3D 采样，
           * 三线性插值由硬件做。wrapS/T/R 全设 REPEAT，噪声才能无限平铺。
           */
          async loadVolumeTexture(url, size) {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`${url} 加载失败：HTTP ${res.status}`);
            const data = new Uint8Array(await res.arrayBuffer());
            const expected = size * size * size;
            if (data.length !== expected) {
              throw new Error(`${url} 大小不对：期望 ${expected}，实际 ${data.length}`);
            }
            return new Cesium.Texture3D({
              context: this.viewer.scene.context,
              width: size,
              height: size,
              depth: size,
              pixelFormat: Cesium.PixelFormat.RED,
              pixelDatatype: Cesium.PixelDatatype.UNSIGNED_BYTE,
              flipY: false,
              sampler: new Cesium.Sampler({
                minificationFilter: Cesium.TextureMinificationFilter.LINEAR,
                magnificationFilter: Cesium.TextureMagnificationFilter.LINEAR,
                wrapS: Cesium.TextureWrap.REPEAT,
                wrapT: Cesium.TextureWrap.REPEAT,
                wrapR: Cesium.TextureWrap.REPEAT,
              }),
              source: { width: size, height: size, depth: size, arrayBufferView: data },
            });
          },

          async loadNoiseTextures() {
            try {
              const [shape, shapeDetail] = await Promise.all([
                this.loadVolumeTexture("./data/clouds/shape.bin", 128),
                this.loadVolumeTexture("./data/clouds/shape_detail.bin", 32),
              ]);
              this.volumeTextures.shape = shape;
              this.volumeTextures.shapeDetail = shapeDetail;
              console.log("[体积云02] 噪声纹理就绪", {
                shape: shape.width + "³",
                shapeDetail: shapeDetail.width + "³",
              });
            } catch (e) {
              console.error("[体积云02] 噪声纹理加载失败：", e);
            }
          },

          addClouds() {
            const viewer = this.viewer;
            const p = this.params;

            this.cloudStage = new Cesium.PostProcessStage({
              name: "volumetricClouds01",
              fragmentShader: CLOUD_SHADER,
              uniforms: {
                // 相机在球坐标系里的位置
                u_cameraPositionSphere: () => this.computeSphereCenter(),
                u_cameraDirection: () => viewer.camera.directionWC,
                u_cameraRight: () => viewer.camera.rightWC,
                u_cameraUp: () => viewer.camera.upWC,
                u_tanHalfFov: () => {
                  const fovy = viewer.camera.frustum.fovy;
                  const aspect = viewer.camera.frustum.aspectRatio;
                  const tanY = Math.tan(fovy * 0.5);
                  if (!this._tanHalfFov)
                    this._tanHalfFov = new Cesium.Cartesian2();
                  this._tanHalfFov.x = tanY * aspect;
                  this._tanHalfFov.y = tanY;
                  return this._tanHalfFov;
                },

                u_bottomRadius: () => BOTTOM_RADIUS,
                u_minHeight: () => p.baseHeight,
                u_maxHeight: () => p.baseHeight + p.thickness,

                u_stepCount: () => p.stepCount,
                u_maxDistance: () => p.maxDistance,

                u_densityScale: () => p.densityScale,
                u_coverage: () => p.coverage,
                u_cloudColor: () =>
                  Cesium.Color.fromCssColorString(p.cloudColor),

                // ===== 本篇新增：形状噪声 =====
                shapeTexture: () => this.volumeTextures.shape,
                shapeDetailTexture: () => this.volumeTextures.shapeDetail,
                u_shapeRepeat: () => p.shapeRepeat,
                u_shapeDetailRepeat: () => p.shapeDetailRepeat,
                u_shapeAmount: () => p.shapeAmount,
                u_shapeDetailAmount: () => p.shapeDetailAmount,
                u_shapeAlteringBias: () => p.shapeAlteringBias,
                u_coverageFilterWidth: () => 0.6,
                u_profileLinear: () => p.profileLinear,
                u_profileConstant: () => p.profileConstant,

                // ===== 本篇新增：场景遮挡 =====
                u_depthTestEnabled: () => (p.depthTest ? 1 : 0),
                u_occlusionBandScale: () => p.occlusionBandScale,
                u_debugSceneDepth: () => (p.debugSceneDepth ? 1 : 0),
              },
            });

            viewer.scene.postProcessStages.add(this.cloudStage);
          },

          addlilgui() {
            let myLilGui = new GUI({ title: "体积云 03 · 场景遮挡" });
            this.myLilGui = myLilGui;
            const p = this.params;

            const cloudFolder = myLilGui.addFolder("云层");
            cloudFolder.add(p, "baseHeight", 200, 8000, 50).name("云底高度(m)");
            cloudFolder.add(p, "thickness", 300, 8000, 50).name("云层厚度(m)");
            cloudFolder.add(p, "densityScale", 0.05, 3, 0.05).name("密度倍率");
            cloudFolder.add(p, "coverage", 0.05, 0.95, 0.01).name("覆盖率");
            cloudFolder.addColor(p, "cloudColor").name("云的底色");

            // ===== 本篇新增：形状 =====
            const shapeFolder = myLilGui.addFolder("形状");
            shapeFolder
              .add(p, "shapeAmount", 0, 1, 0.01)
              .name("形状噪声强度");
            shapeFolder
              .add(p, "shapeRepeat", 0.00001, 0.0004, 0.00001)
              .name("形状纹理密度");
            shapeFolder
              .add(p, "shapeDetailAmount", 0, 1, 0.01)
              .name("细节侵蚀强度");
            shapeFolder
              .add(p, "shapeDetailRepeat", 0.001, 0.012, 0.0005)
              .name("细节纹理密度");
            shapeFolder
              .add(p, "shapeAlteringBias", 0.1, 1.5, 0.01)
              .name("高度梯度偏置");

            // ===== 本篇新增：场景遮挡 =====
            const occlFolder = myLilGui.addFolder("场景遮挡");
            occlFolder
              .add(p, "depthTest")
              .name("启用深度遮挡");
            occlFolder
              .add(p, "occlusionBandScale", 0, 0.2, 0.005)
              .name("软化带比例");
            occlFolder
              .add(p, "debugSceneDepth")
              .name("显示场景深度（调试）");

            const profileFolder = myLilGui.addFolder("密度剖面");
            profileFolder
              .add(p, "profileLinear", 0, 2, 0.01)
              .name("线性项");
            profileFolder
              .add(p, "profileConstant", 0, 1, 0.01)
              .name("常数项");

            const marchFolder = myLilGui.addFolder("步进");
            marchFolder.add(p, "stepCount", 8, 512, 1).name("采样步数");
            marchFolder
              .add(p, "maxDistance", 5000, 300000, 1000)
              .name("最远步进距离(m)");

            const viewFolder = myLilGui.addFolder("视图");
            viewFolder
              .add({ fn: () => this.resetCamera() }, "fn")
              .name("重置视角");

            const layerFolder = myLilGui.addFolder("图层控制");
            layerFolder
              .add(this.imageryLayer, "show")
              .name("影像图层显示/隐藏");
            layerFolder
              .add(this.imageryLayer, "alpha", 0, 1, 0.01)
              .name("影像图层透明度");
          },

          resetCamera() {
            if (!this.viewer) return;
            this.viewer.camera.setView({
              destination: Cesium.Cartesian3.fromDegrees(116.4, 39.9, 7000),
              orientation: {
                heading: Cesium.Math.toRadians(0),
                pitch: Cesium.Math.toRadians(-17),
                roll: 0,
              },
            });
          },
        },
      }).mount("#app");
    </script>
