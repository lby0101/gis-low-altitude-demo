      // ---- 透射率 LUT（2D：r × mu）----
      vec2 atmTransmittanceUvFromRMu(float r, float mu) {
        float H = sqrt(ATM_TOP_RADIUS * ATM_TOP_RADIUS - ATM_BOTTOM_RADIUS * ATM_BOTTOM_RADIUS);
        float rho = atmSafeSqrt(r * r - ATM_BOTTOM_RADIUS * ATM_BOTTOM_RADIUS);
        float d = atmDistanceToTopBoundary(r, mu);
        float dMin = ATM_TOP_RADIUS - r;
        float dMax = rho + H;
        float xMu = (d - dMin) / (dMax - dMin);
        float xR = rho / H;
        return vec2(atmTextureCoordFromUnitRange(xMu, TRANSMITTANCE_TEXTURE_WIDTH),
                    atmTextureCoordFromUnitRange(xR, TRANSMITTANCE_TEXTURE_HEIGHT));
      }
      vec3 atmTransmittanceToTop(float r, float mu) {
        return vec3(texture(transmittanceTexture, atmTransmittanceUvFromRMu(r, mu)).rgb);
      }
      vec3 atmTransmittance(float r, float mu, float d, bool rayIntersectsGround) {
        float rD = atmClampRadius(sqrt(d * d + 2.0 * r * mu * d + r * r));
        float muD = atmClampCosine((r * mu + d) / rD);
        if (rayIntersectsGround) {
          return min(atmTransmittanceToTop(rD, -muD) / atmTransmittanceToTop(r, -mu), vec3(1.0));
        }
        return min(atmTransmittanceToTop(r, mu) / atmTransmittanceToTop(rD, muD), vec3(1.0));
      }
      // 从某个点朝太阳看，大气挡掉多少
      vec3 atmTransmittanceToSun(float r, float muS) {
        float sinThetaH = ATM_BOTTOM_RADIUS / r;
        float cosThetaH = -sqrt(max(1.0 - sinThetaH * sinThetaH, 0.0));
        return atmTransmittanceToTop(r, muS) *
          smoothstep(-sinThetaH * ATM_SUN_ANGULAR_RADIUS,
                      sinThetaH * ATM_SUN_ANGULAR_RADIUS,
                      muS - cosThetaH);
      }

      // ---- 相函数 ----
      float atmRayleighPhase(float nu) {
        return 3.0 / (16.0 * ATM_PI) * (1.0 + nu * nu);
      }
      float atmMiePhase(float g, float nu) {
        float k = 3.0 / (8.0 * ATM_PI) * (1.0 - g * g) / (2.0 + g * g);
        return k * (1.0 + nu * nu) / pow(1.0 + g * g - 2.0 * g * nu, 1.5);
      }

      // ---- 散射 LUT（3D：nu × mu_s × mu，R 轴打包）----
      vec4 atmScatteringUvwz(float r, float mu, float muS, float nu, bool rayIntersectsGround) {
        float H = sqrt(ATM_TOP_RADIUS * ATM_TOP_RADIUS - ATM_BOTTOM_RADIUS * ATM_BOTTOM_RADIUS);
        float rho = atmSafeSqrt(r * r - ATM_BOTTOM_RADIUS * ATM_BOTTOM_RADIUS);
        float uR = atmTextureCoordFromUnitRange(rho / H, SCATTERING_TEXTURE_R_SIZE);
        float rMu = r * mu;
        float discriminant = rMu * rMu - r * r + ATM_BOTTOM_RADIUS * ATM_BOTTOM_RADIUS;
        float uMu;
        if (rayIntersectsGround) {
          float d = -rMu - atmSafeSqrt(discriminant);
          float dMin = r - ATM_BOTTOM_RADIUS;
          float dMax = rho;
          uMu = 0.5 - 0.5 * atmTextureCoordFromUnitRange(
            dMax == dMin ? 0.0 : (d - dMin) / (dMax - dMin), SCATTERING_TEXTURE_MU_SIZE / 2);
        } else {
          float d = -rMu + atmSafeSqrt(discriminant + H * H);
          float dMin = ATM_TOP_RADIUS - r;
          float dMax = rho + H;
          uMu = 0.5 + 0.5 * atmTextureCoordFromUnitRange(
            (d - dMin) / (dMax - dMin), SCATTERING_TEXTURE_MU_SIZE / 2);
        }
        float dSun = atmDistanceToTopBoundary(ATM_BOTTOM_RADIUS, muS);
        float dMinS = ATM_TOP_RADIUS - ATM_BOTTOM_RADIUS;
        float a = (dSun - dMinS) / (H - dMinS);
        float dMinus = atmDistanceToTopBoundary(ATM_BOTTOM_RADIUS, ATM_MU_S_MIN);
        float A = (dMinus - dMinS) / (H - dMinS);
        float uMuS = atmTextureCoordFromUnitRange(max(1.0 - a / A, 0.0) / (1.0 + a),
                                                  SCATTERING_TEXTURE_MU_S_SIZE);
        float uNu = (nu + 1.0) / 2.0;
        return vec4(uNu, uMuS, uMu, uR);
      }
      vec3 atmGetScattering(sampler3D tex, float r, float mu, float muS, float nu,
                            bool rayIntersectsGround) {
        vec4 uvwz = atmScatteringUvwz(r, mu, muS, nu, rayIntersectsGround);
        float texCoordX = uvwz.x * float(SCATTERING_TEXTURE_NU_SIZE - 1);
        float texX = floor(texCoordX);
        float lerp = texCoordX - texX;
        vec3 uvw0 = vec3((texX + uvwz.y) / float(SCATTERING_TEXTURE_NU_SIZE), uvwz.z, uvwz.w);
        vec3 uvw1 = vec3((texX + 1.0 + uvwz.y) / float(SCATTERING_TEXTURE_NU_SIZE), uvwz.z, uvwz.w);
        return vec3(texture(tex, uvw0).rgb * (1.0 - lerp) + texture(tex, uvw1).rgb * lerp);
      }
      // 从散射 LUT 里反推 Mie 单次散射（源库把 Mie 打包进了同一个纹理）
      vec3 atmExtrapolateSingleMie(vec4 scattering) {
        if (scattering.r < 1e-5) return vec3(0.0);
        return scattering.rgb * scattering.a / scattering.r *
          (ATM_RAYLEIGH_SCATTERING.r / ATM_MIE_SCATTERING.r) *
          (ATM_MIE_SCATTERING / ATM_RAYLEIGH_SCATTERING);
      }
      vec3 atmCombinedScattering(float r, float mu, float muS, float nu,
                                 bool rayIntersectsGround, out vec3 singleMie) {
        vec4 uvwz = atmScatteringUvwz(r, mu, muS, nu, rayIntersectsGround);
        float texCoordX = uvwz.x * float(SCATTERING_TEXTURE_NU_SIZE - 1);
        float texX = floor(texCoordX);
        float lerp = texCoordX - texX;
        vec3 uvw0 = vec3((texX + uvwz.y) / float(SCATTERING_TEXTURE_NU_SIZE), uvwz.z, uvwz.w);
        vec3 uvw1 = vec3((texX + 1.0 + uvwz.y) / float(SCATTERING_TEXTURE_NU_SIZE), uvwz.z, uvwz.w);
        vec4 combined = texture(scatteringTexture, uvw0) * (1.0 - lerp) +
                        texture(scatteringTexture, uvw1) * lerp;
        singleMie = atmExtrapolateSingleMie(combined);
        return vec3(combined.rgb);
      }

      // ---- 辐照度 LUT（2D：mu_s × r）----
      vec3 atmIrradiance(float r, float muS) {
        float xR = (r - ATM_BOTTOM_RADIUS) / (ATM_TOP_RADIUS - ATM_BOTTOM_RADIUS);
        float xMuS = muS * 0.5 + 0.5;
        vec2 uv = vec2(atmTextureCoordFromUnitRange(xMuS, IRRADIANCE_TEXTURE_WIDTH),
                       atmTextureCoordFromUnitRange(xR, IRRADIANCE_TEXTURE_HEIGHT));
        return vec3(texture(irradianceTexture, uv).rgb);
      }

      // ---- 太阳 + 天空辐照度（云的环境光就来自这儿）----
      //
      // 这是**余弦加权**版（源库的 GetSunAndSkyIrradiance）：
      //   sun = solar × T_sun × max(dot(normal, sunDir), 0)
      //   sky = Irradiance × (1 + dot(normal, point)/r) × 0.5
      // 它描述的是「一个 Lambert 表面」收到的辐照度 —— 适合地面，不适合云。
      vec3 atmSunAndSkyIrradiance(vec3 point, vec3 normal, vec3 sunDirection,
                                  out vec3 skyIrradiance) {
        float r = length(point);
        float muS = dot(point, sunDirection) / r;
        skyIrradiance = atmIrradiance(r, muS) * (1.0 + dot(normal, point) / r) * 0.5;
        return ATM_SOLAR_IRRADIANCE * atmTransmittanceToSun(r, muS) *
               max(dot(normal, sunDirection), 0.0);
      }

      /**
       * ===== 修正：**标量**辐照度（源库的 GetSunAndSkyScalarIlluminance）=====
       *
       * 云不是表面，是**参与介质**：一个体积元从整个上半球各方向收光，
       * 所以没有「法线」这回事，也就不该乘 cos 项。物理上正确的写法是对
       * 上半球积分 —— 各向同性时正好等于「辐照度 × 2π」：
       *
       *   sun = solar_irradiance × T_sun          （无 cos 项）
       *   sky = GetIrradiance(r, mu_s) × 2π
       *
       * 源库给云用的就是这个版本。
       *
       * 之前这里错用了余弦加权版、还把 normal 传成径向 shellDir，于是：
       *   · 太阳光多乘一个 max(mu_s, 0) —— 正午 mu_s≈0.96 看不出，
       *     黄昏 7° 时 mu_s≈0.12，云比源库暗约 8 倍，整片云发灰不暖；
       *   · 天空光因 normal ∥ point 使 (1 + dot/r) 恒等于 2，再 ×0.5
       *     就退化成 ×1.0，比源库弱 2π ≈ 6.28 倍 ——
       *     这就是当初要拿 skyIrradianceScale = 4 去硬补的原因。
       */
      vec3 atmSunAndSkyScalarIrradiance(vec3 point, vec3 sunDirection,
                                        out vec3 skyIrradiance) {
        float r = length(point);
        float muS = dot(point, sunDirection) / r;
        skyIrradiance = atmIrradiance(r, muS) * 2.0 * ATM_PI;
        return ATM_SOLAR_IRRADIANCE * atmTransmittanceToSun(r, muS);
      }

      // ---- 相机到某点的天空辐亮度（空气透视 + 光束都在这里）----
      vec2 atmRaySphereIntersections(vec3 camera, vec3 direction, float radius) {
        float b = 2.0 * dot(direction, camera);
        float c = dot(camera, camera) - radius * radius;
        float discriminant = b * b - 4.0 * c;
        float Q = sqrt(max(discriminant, 0.0));
        return vec2(-b - Q, -b + Q) * 0.5;
      }
      vec3 atmClosestPointOnRay(vec3 camera, vec3 point) {
        vec3 ray = point - camera;
        float t = clamp(-dot(camera, ray) / dot(ray, ray), 0.0, 1.0);
        return camera + t * ray;
      }
      bool atmClipAtBottom(vec3 viewRay, inout vec3 camera, inout vec3 point) {
        float rCamera = length(camera);
        float rPoint = length(point);
        bool cameraBelow = rCamera < ATM_BOTTOM_RADIUS;
        bool pointBelow = rPoint < ATM_BOTTOM_RADIUS;
        vec2 t = atmRaySphereIntersections(camera, viewRay, ATM_BOTTOM_RADIUS);
        vec3 intersection = camera + viewRay * (cameraBelow ? t.y : t.x);
        camera = cameraBelow ? intersection : camera;
        point = pointBelow ? intersection : point;
        return cameraBelow && pointBelow;
      }

      /**
       * 相机 → point 这段路径上，大气贡献了多少散射光。
       *
       * shadow_length 是「被云挡掉的那一段长度」：只让**没被挡**的那部分
       * 产生散射 —— 云缝里的光柱就是这么来的。
       */
      vec3 atmSkyRadianceToPoint(vec3 camera, vec3 point, float shadowLength,
                                 vec3 sunDirection, out vec3 transmittance) {
        if (length(atmClosestPointOnRay(camera, point)) > ATM_TOP_RADIUS) {
          transmittance = vec3(1.0);
          return vec3(0.0);
        }
        vec3 viewRay = normalize(point - camera);
        if (atmClipAtBottom(viewRay, camera, point)) {
          transmittance = vec3(1.0);
          return vec3(0.0);
        }
        float r = length(camera);
        float rmu = dot(camera, viewRay);
        float distToTop = -rmu - atmSafeSqrt(rmu * rmu - r * r + ATM_TOP_RADIUS * ATM_TOP_RADIUS);
        if (distToTop > 0.0) {
          camera = camera + viewRay * distToTop;
          r = ATM_TOP_RADIUS;
          rmu += distToTop;
        }
        float mu = rmu / r;
        float muS = dot(camera, sunDirection) / r;
        float nu = dot(viewRay, sunDirection);
        float d = length(point - camera);
        bool hitsGround = atmRayIntersectsGround(r, mu);
        if (!hitsGround) {
          float muHorizon = -atmSafeSqrt(1.0 - (ATM_BOTTOM_RADIUS * ATM_BOTTOM_RADIUS) / (r * r));
          mu = max(mu, muHorizon + 0.004);
        }
        transmittance = atmTransmittance(r, mu, d, hitsGround);

        vec3 singleMie;
        vec3 scattering = atmCombinedScattering(r, mu, muS, nu, hitsGround, singleMie);

        d = max(d - shadowLength, 0.0);
        float rP = atmClampRadius(sqrt(d * d + 2.0 * r * mu * d + r * r));
        float muP = (r * mu + d) / rP;
        float muSP = (r * muS + d * nu) / rP;
        vec3 singleMieP;
        vec3 scatteringP = atmCombinedScattering(rP, muP, muSP, nu, hitsGround, singleMieP);

        vec3 shadowTransmittance = transmittance;
        if (shadowLength > 0.0) {
          shadowTransmittance = atmTransmittance(r, mu, d, hitsGround);
        }
        vec3 higherOrder = atmGetScattering(higherOrderScatteringTexture,
                                            r, mu, muS, nu, hitsGround);
        vec3 singleScattering = scattering - higherOrder;
        vec3 higherOrderP = atmGetScattering(higherOrderScatteringTexture,
                                             rP, muP, muSP, nu, hitsGround);
        vec3 singleScatteringP = scatteringP - higherOrderP;

        scattering = singleScattering - shadowTransmittance * singleScatteringP +
                     higherOrder - transmittance * higherOrderP;
        singleMie = singleMie - shadowTransmittance * singleMieP;
        singleMie = atmExtrapolateSingleMie(vec4(scattering, singleMie.r));
        singleMie = singleMie * smoothstep(0.0, 0.01, muS);

        return scattering * atmRayleighPhase(nu) +
               singleMie * atmMiePhase(ATM_MIE_PHASE_FUNCTION_G, nu);
      }

      // 亮度版包装（源库给云着色器调的就是这个）
      vec3 atmSkyLuminanceToPoint(vec3 camera, vec3 point, float shadowLength,
                                  vec3 sunDirection, out vec3 transmittance) {
        return atmSkyRadianceToPoint(camera, point, shadowLength, sunDirection, transmittance) *
               SKY_SPECTRAL_RADIANCE_TO_LUMINANCE;
      }
      // ===== 修正：改用**标量**辐照度（对齐源库）=====
      // 云是参与介质，收的是整个上半球的光，没有 cos 项。
      vec3 atmSunAndSkyIlluminance(vec3 point, vec3 sunDirection,
                                   out vec3 skyIrradiance, float skyScale) {
        vec3 sunIrradiance =
          atmSunAndSkyScalarIrradiance(point, sunDirection, skyIrradiance);
        skyIrradiance *= SKY_SPECTRAL_RADIANCE_TO_LUMINANCE * skyScale;
        return sunIrradiance * SUN_SPECTRAL_RADIANCE_TO_LUMINANCE;
      }

      // ===== 修正：曝光 + 色调映射（对齐源库 ResolvePass）=====
      // 云层 Pass 输出的 rgb 是**预乘过不透明度**的线性辐射亮度，
      // 这里要先还原成直色、乘曝光、过色调曲线，最后再乘回不透明度。
      uniform float u_exposure;
      uniform float u_cloudContrast;

      // Khronos PBR Neutral —— 和 Cesium 自己用的那条曲线一致。
      // 用它才不会在「云 / 天空」交界处留一条接缝。
      vec3 pbrNeutralToneMapping(vec3 color) {
        const float startCompression = 0.8 - 0.04;
        const float desaturation = 0.15;
        float x = min(color.r, min(color.g, color.b));
        float offset = x < 0.08 ? x - 6.25 * x * x : 0.04;
        color -= offset;
        float peak = max(color.r, max(color.g, color.b));
        if (peak < startCompression) {
          return color;
        }
        float d = 1.0 - startCompression;
        float newPeak = 1.0 - d * d / (peak + d - startCompression);
        color *= newPeak / peak;
        float g = 1.0 - 1.0 / (desaturation * (peak - newPeak) + 1.0);
        return mix(color, newPeak * vec3(1.0), g);
      }

      /**
       * 把「预乘的线性云辐射」送到**显示空间**，返回仍是预乘形式。
       *
       * ⚠️ 顺序不能变：
       *   ① ÷α       —— 预乘还原成直色，后面的非线性操作必须作用在直色上
       *   ② × 曝光    —— 线性空间里乘
       *   ③ pow(对比) —— 曲线之前提/压暗部（<1 变柔，>1 变硬）
       *   ④ 色调映射   —— PBR Neutral 压高光
       *   ⑤ inverseGamma —— Cesium 的场景色已经 gamma 编码过，云要跟上
       *   ⑥ × α       —— 乘回预乘形式，才能和场景色直接相加
       */
      vec3 encodeCloudForDisplay(vec3 premultipliedRadiance, float alpha) {
        if (alpha <= 1e-6) {
          return vec3(0.0);
        }
        vec3 radiance = premultipliedRadiance / alpha;
        radiance *= u_exposure;
        radiance = pow(max(radiance, 0.0), vec3(u_cloudContrast));
        radiance = pbrNeutralToneMapping(radiance);
        return czm_inverseGamma(max(radiance, 0.0)) * alpha;
      }

void main() {
  vec2 uv = v_textureCoordinates;
  vec4 sceneColor = texture(colorTexture, uv);

  // —— 1. 地面云影 ——
  // 云影是乘在**场景颜色**上的，所以必须在这一层做。
  vec2 ndc = uv * 2.0 - 1.0;
  vec3 rayDir = normalize(
    u_cameraDirection +
    u_cameraRight * (ndc.x * u_tanHalfFov.x) +
    u_cameraUp    * (ndc.y * u_tanHalfFov.y)
  );
  vec3 sceneShadowed = sceneColor.rgb;
  applyGroundShadow(sceneShadowed, u_cameraPositionSphere, rayDir);

  // 调试：直接看累积缓冲
  if (u_temporalDebug > 1.5) {
    out_FragColor = vec4(texture(historyBuffer, uv).rgb, 1.0);
    return;
  }

  // —— 2. 取云层：开累积看历史，关累积看本帧低分辨率原图 ——
  vec4 cloud = (u_temporalEnabled > 0.5 && u_temporalDebug < 0.5)
    ? texture(historyBuffer, uv)
    : texture(cloudBuffer, uv);

  // —— 3. 合成 ——
  // ===== 修正：云要先送到显示空间，再和场景色相加 =====
  // 场景色 sceneColor 已经被 Cesium 色调映射 + gamma 编码过了；
  // 云层缓冲里还是**线性**的预乘辐射。两者直接相加会：
  //   · 高光切白（没有曲线压）；
  //   · 云和天空之间留一条接缝（两条不同的传递函数）。
  // 所以这里先用 encodeCloudForDisplay 把云走一遍和 Cesium 相同的显示变换。
  //
  // 空气透视和光束不在这里做 —— 它们在云层 Pass 里算，
  // 因为只有那里才知道「云的前表面」有多远。
  vec3 cloudDisplay = encodeCloudForDisplay(cloud.rgb, cloud.a);

  out_FragColor = vec4(sceneShadowed * (1.0 - cloud.a) + cloudDisplay, sceneColor.a);
}
`;

              //
              // 所以这里把风的「时钟」拨快。默认 10 倍：
              // 一分钟能看到 85 px 的位移，是「延时摄影」的观感。
              // 调回 1 就是严格实时。
              windTimeScale: 10,
              // 50 平铺：一张天气图的格子约 400 km，
              // 屏幕上能同时看到好几团云和它们的间隙。
              // 调到 6 会变成 3000 km 一格，整屏都在同一团云里，
              // 看起来就是「均匀的一片白」；
              // 调到 100 则格子只有 200 km，云碎成一颗颗小疙瘩。
              weatherRepeat: 50,        // 天气图平铺次数
              weatherExponent: 1.0,     // 天气值指数
              turbulenceRepeat: 20,     // 湍流平铺次数
              turbulenceDisplacement: 350,  // 湍流位移（米）
              // ===== 本篇新增：云影 =====
              shadowsEnabled: true,     // 关掉就回到第 5 篇（没有阴影）
              shadowCascadeCount: 3,    // 级联数量
              cascadeSize1: 8000,       // 级联 1 覆盖边长（米）
              cascadeSize2: 32000,      // 级联 2
              cascadeSize3: 128000,     // 级联 3
              shadowStepCount: 24,      // 阴影图每根光线走多少步
              shadowMaxDistance: 40000, // 阴影光线最远走多远
              shadowMinDensity: 0.01,   // 低于这个密度不算「有云」
              shadowIntensity: 1.0,     // 云影强度
              shadowBlur: 1.5,          // PCF 半径（纹素）
              castShadowOnScene: true,  // 把云影投到地面
              shadowOnSceneIntensity: 0.7,
              shadowDebug: 0,           // 0=关 1=地面阴影 2=阴影图集
              // ===== 本篇新增：时间累积 =====
              temporalEnabled: true,    // 关掉 = 噪点原样呈现（对比用）
              renderScale: 0.5,        // 云层按这个比例渲染：1 / 0.5 / 0.25
              temporalAlpha: 0.12,      // 本帧权重 α，越小历史越重、越平滑
              varianceGamma: 2.0,       // 方差裁剪 γ，防鬼影
              jitterEnabled: true,      // 关掉 = 回到「有条带」的样子
              stbnEnabled: true,        // 用时空蓝噪声当步进相位（关掉退回 Bayer）
              temporalDebug: 0,         // 0=关 1=只看本帧 2=只看累积缓冲
              // ===== 本篇新增：大气 =====
              atmosphereEnabled: true,  // 关掉 = 回到第 7 篇（常量太阳色/天空色）
              sunIrradianceScale: 1.0,  // 太阳辐照度倍率
              // ===== 修正：改回 1.0 =====
              // 之前写 4.0 是为了补「天空光比源库弱 2π 倍」的窟窿。
              // 现在辐照度换成标量版（× 2π），这个补偿就不需要了 ——
              // 留着 4.0 会让环境光反而比源库亮 4 倍、云发白发平。
              skyIrradianceScale: 1.0,  // 天空辐照度倍率
              // 空气透视的终点用**云的前表面**（和源库一致），不算到地面。
              // 算到地面的话路径长 5 倍，透射率掉到 0.8/0.6，整幅画面被压暗偏红。
              // ⚠️ 效果依赖视角：相机在云层**上方**时几乎看不见，
              //    要切「云下仰视（800 m）」朝太阳看才明显。
              aerialPerspective: true,  // 空气透视（远处按距离混进大气散射）
              lightShafts: true,        // 光束（只让没被云挡住的那段产生散射）
              aerialScale: 1.0,         // 空气透视强度（只缩放 in-scatter）
              // 源库不做这个色相修正，默认关。正午仍偏橙时再打开。
              inscatterHueFix: false,
              atmoDebug: 0,             // 临时调试：1=太阳辐照度 2=天空辐照度
            },
          };
        },
        async mounted() {
          this.initMap();
          this.loadTileset();
          // ===== 本篇新增：3D 噪声纹理必须先就绪，再挂后处理 =====
          await this.loadNoiseTextures();
          this.addClouds();
          this.addlilgui();
        },
        beforeUnmount() {
          // ===== 本篇新增：摘掉 postRender 回调 + 释放 GPU 资源 =====
          if (this._postRenderRemover) {
            this._postRenderRemover();
            this._postRenderRemover = null;
          }
          this.disposeAll();
          if (this.myLilGui) {
            this.myLilGui.destroy();
            this.myLilGui = null;
          }
        },
        methods: {
          initMap() {
            // ===== 本篇新增：固定起始时间 =====
            // 不指定的话，页面在夜里打开就是一片黑云。
            // 而且 viewer 会在构造后用自己的 clock 覆盖 currentTime，
            // 所以必须**在构造时**就把 clockViewModel 传进去。
            const startTime = Cesium.JulianDate.fromIso8601("2026-06-21T04:00:00Z");
            const clock = new Cesium.Clock({
              currentTime: Cesium.JulianDate.clone(startTime),
              startTime: Cesium.JulianDate.addDays(startTime, -1, new Cesium.JulianDate()),
              stopTime: Cesium.JulianDate.addDays(startTime, 1, new Cesium.JulianDate()),
              clockRange: Cesium.ClockRange.LOOP_STOP,
              shouldAnimate: true,
              multiplier: 20,
            });

            let viewer = new Cesium.Viewer("cesiumContainer", {
              // ===== 本篇新增：时间轴 =====
              // 光照完全由太阳方向决定，所以「时间」本身就是这个 demo 的一个参数。
              // 打开时间轴，读者才能亲手把太阳拖到不同位置看云的明暗变化。
              // （前 3 篇没有光照，时间无关，所以不开。）
              //
              // ⚠️ 只改这两行的值，不要再往上加一份 timeline/animation ——
              // 对象字面量里重复的 key 是**后者覆盖前者**，
              // 上面写了 true、下面还留着 false 的话，等于没开。
              clockViewModel: new Cesium.ClockViewModel(clock),
              baseLayer: false,
              animation: true,
              timeline: true,
              fullscreenButton: false,
              infoBox: false,
              geocoder: false,
              homeButton: false,
              sceneModePicker: false,
              baseLayerPicker: false,
              navigationHelpButton: false,
              selectionIndicator: false,
              shouldAnimate: true,
            });

            window.viewer = viewer;
            // viewer.scene.debugShowFramesPerSecond = true;
            viewer.scene.globe.enableLighting = true;
            viewer.scene.fog.enabled = true;
            viewer.scene.skyAtmosphere.show = true;
            viewer._cesiumWidget._creditContainer.style.display = "none";

            let imageryLayer = viewer.imageryLayers.addImageryProvider(
              new Cesium.UrlTemplateImageryProvider({
                url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                maximumLevel: 18,
              }),
            );

            this.viewer = viewer;
            this.imageryLayer = imageryLayer;

            // 相机放在云层之上，略微俯视 —— 能同时看到云顶和地平线
            viewer.camera.setView({
              destination: Cesium.Cartesian3.fromDegrees(116.4, 39.9, 7000),
              orientation: {
                heading: Cesium.Math.toRadians(0),
                pitch: Cesium.Math.toRadians(-17),
                roll: 0,
              },
            });
            return viewer;
          },
          async loadTileset() {
            try {
              this.statusText = "正在加载 3D Tiles 白模…";
              this.tileset = await Cesium.Cesium3DTileset.fromUrl(
                "../data/tileset/baimo/tileset.json",
                {
                  maximumScreenSpaceError: 16,
                  maximumMemoryUsage: 2048,
                },
              );
              this.viewer.scene.primitives.add(this.tileset);
              await this.viewer.zoomTo(this.tileset);
              this.statusText = "模型加载完成。";
            } catch (error) {
              console.warn("3D Tiles 加载失败：", error);
              this.statusText = `3D Tiles 加载失败：${error.message}`;
            }
          },

          /**
           * 每帧算一次「云壳球心」。
           *
           * 这个球要满足：半径固定为 BOTTOM_RADIUS，且与椭球在**相机的地面投影点**
           * 处相切。所以球心 = 地面点 - 法线 * BOTTOM_RADIUS。
           *
           * 直观理解：球心会落在离地心很近的地方，整个球几乎是「以地心为球心、
           * 半径 6360km」的一个球，只是沿法线挪了一点，好让球面正好压在地面点上。
           * 这样云层高度就永远相对「脚下的地面」来算。
           */
          computeSphereCenter() {
            const s = this.scratch;
            const ellipsoid = this.viewer.scene.globe.ellipsoid;
            const cameraPosition = this.viewer.camera.positionWC;

            if (!s.carto) s.carto = new Cesium.Cartographic();
            if (!s.surface) s.surface = new Cesium.Cartesian3();
            if (!s.normal) s.normal = new Cesium.Cartesian3();
            if (!s.center) s.center = new Cesium.Cartesian3();

            const carto = Cesium.Cartographic.fromCartesian(
              cameraPosition,
              ellipsoid,
              s.carto,
            );
            carto.height = 0;
            const surface = Cesium.Cartographic.toCartesian(
              carto,
              ellipsoid,
              s.surface,
            );
            const normal = ellipsoid.geodeticSurfaceNormal(surface, s.normal);

            const center = Cesium.Cartesian3.multiplyByScalar(
              normal,
              BOTTOM_RADIUS,
              s.center,
            );
            Cesium.Cartesian3.subtract(surface, center, center);

            // 相对相机的位置（球坐标系里的相机位置 = 球心 - 相机位置 取反）
            const centerRelative = Cesium.Cartesian3.subtract(
              center,
              cameraPosition,
              s.centerRelative || (s.centerRelative = new Cesium.Cartesian3()),
            );
            return Cesium.Cartesian3.negate(
              centerRelative,
              s.cameraPositionSphere ||
                (s.cameraPositionSphere = new Cesium.Cartesian3()),
            );
          },

          /**
           * ===== 本篇新增 =====
           * 求「指向太阳」的单位向量（ECEF）。
           *
           * 先用 Simon1994 算出太阳在**惯性系**里的位置，
           * 再用 computeIcrfToFixedMatrix 转到**地固系**。
           *
           * 云壳坐标系只是把地固系平移了一下，方向不变，
           * 所以这个向量可以直接拿到着色器里用。
           */
          /**
           * ===== 本篇新增 =====
           * 跳到指定时间。
           *
           * 注意用 clockViewModel 而不是 viewer.clock ——
           * viewer 的 clock 是受 view model 驱动的，直接改会被覆盖回去。
           */
          setTime(iso) {
            if (!this.viewer) return;
            this.viewer.clockViewModel.currentTime =
              Cesium.JulianDate.fromIso8601(iso);
          },

          /** 把 #rrggbb 转成 vec3（0~1），给 vec3 uniform 用 */
          hexToVec3(hex) {
            const c = Cesium.Color.fromCssColorString(hex);
            if (!this._vec3Cache) this._vec3Cache = {};
            const k = hex;
            if (!this._vec3Cache[k]) this._vec3Cache[k] = new Cesium.Cartesian3();
            this._vec3Cache[k].x = c.red;
            this._vec3Cache[k].y = c.green;
            this._vec3Cache[k].z = c.blue;
            return this._vec3Cache[k];
          },

          computeSunDirection() {
            const s = this.scratch;
            if (!s.sunPos) s.sunPos = new Cesium.Cartesian3();
            if (!s.icrf) s.icrf = new Cesium.Matrix3();

            const time = this.viewer.clock.currentTime;
            Cesium.Simon1994PlanetaryPositions.computeSunPositionInEarthInertialFrame(
              time, s.sunPos,
            );
            const m = Cesium.Transforms.computeIcrfToFixedMatrix(time, s.icrf);
            if (Cesium.defined(m)) {
              Cesium.Matrix3.multiplyByVector(m, s.sunPos, s.sunPos);
            }
            return Cesium.Cartesian3.normalize(s.sunPos, s.sunPos);
          },

          /**
           * ===== 本篇新增 =====
           * 加载预计算的 3D 噪声纹理。
           *
           * 两个 .bin 都是**裸 R8 数据**，没有文件头：
           *   shape.bin        128³ = 2,097,152 字节
           *   shape_detail.bin  32³ =    32,768 字节
           *
           * 用 Cesium.Texture3D 上传，着色器里用 sampler3D 采样，
           * 三线性插值由硬件做。wrapS/T/R 全设 REPEAT，噪声才能无限平铺。
           */
          /**
           * ===== 本篇新增：加载大气 LUT =====
           * 4 个 .bin 都是 RGBA16F 的裸数据（离线预计算好的），
           * 直接按半浮点上传就行，不需要任何解码。
           */
          async loadAtmosphereLut(url, width, height, depth) {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`${url} 加载失败：HTTP ${res.status}`);
            const bytes = new Uint8Array(await res.arrayBuffer());
            const texels = width * height * (depth || 1);
            const expected = texels * 8;   // RGBA × 半浮点 = 8 字节
            if (bytes.length !== expected) {
              throw new Error(`${url} 大小不对：期望 ${expected}，实际 ${bytes.length}`);
            }
            const data = new Uint16Array(bytes.buffer, bytes.byteOffset, texels * 4);
            const common = {
              context: this.viewer.scene.context,
              width,
              height,
              pixelFormat: Cesium.PixelFormat.RGBA,
              pixelDatatype: Cesium.PixelDatatype.HALF_FLOAT,
              flipY: false,
              sampler: new Cesium.Sampler({
                minificationFilter: Cesium.TextureMinificationFilter.LINEAR,
                magnificationFilter: Cesium.TextureMagnificationFilter.LINEAR,
                wrapS: Cesium.TextureWrap.CLAMP_TO_EDGE,
                wrapT: Cesium.TextureWrap.CLAMP_TO_EDGE,
                wrapR: Cesium.TextureWrap.CLAMP_TO_EDGE,
              }),
            };
            if (depth) {
              return new Cesium.Texture3D(Object.assign({
                depth,
                source: { width, height, depth, arrayBufferView: data },
              }, common));
            }
            return new Cesium.Texture(Object.assign({
              source: { width, height, arrayBufferView: data },
            }, common));
          },

          async loadVolumeTexture(url, size, height = size, depth = size) {
            const res = await fetch(url);
            if (!res.ok) throw new Error(`${url} 加载失败：HTTP ${res.status}`);
            const data = new Uint8Array(await res.arrayBuffer());
            const expected = size * height * depth;
            if (data.length !== expected) {
              throw new Error(`${url} 大小不对：期望 ${expected}，实际 ${data.length}`);
            }
            return new Cesium.Texture3D({
              context: this.viewer.scene.context,
              width: size,
              height,
              depth,
              pixelFormat: Cesium.PixelFormat.RED,
              pixelDatatype: Cesium.PixelDatatype.UNSIGNED_BYTE,
              flipY: false,
              sampler: new Cesium.Sampler({
                minificationFilter: Cesium.TextureMinificationFilter.LINEAR,
                magnificationFilter: Cesium.TextureMagnificationFilter.LINEAR,
                wrapS: Cesium.TextureWrap.REPEAT,
                wrapT: Cesium.TextureWrap.REPEAT,
                wrapR: Cesium.TextureWrap.REPEAT,
              }),
              source: { width: size, height, depth, arrayBufferView: data },
            });
          },

          /**
           * ===== 本篇新增 =====
           * 把 PNG 加载成 Cesium 的 2D 纹理。
           * 天气图和湍流图都是普通图片，走 Cesium.Texture 上传即可。
           */
          async loadImageTexture(url) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = url;
            await img.decode();
            return new Cesium.Texture({
              context: this.viewer.scene.context,
              source: img,
              sampler: new Cesium.Sampler({
                minificationFilter: Cesium.TextureMinificationFilter.LINEAR,
                magnificationFilter: Cesium.TextureMagnificationFilter.LINEAR,
                wrapS: Cesium.TextureWrap.REPEAT,
                wrapT: Cesium.TextureWrap.REPEAT,
              }),
            });
          },

          /**
           * ===== 本篇新增 =====
           * 风。一个方法算三组偏移，单位都不一样，别混：
           *
           *   weatherOffset     UV 单位 —— 除以 2e7 把米换算成 UV
           *   shapeOffset       直接乘 shapeRepeat，等价于「形状图滑过多少个自身」
           *   shapeDetailOffset 同理，但系数是 0.2（比形状慢一点，做视差）
           *
           * 为什么形状偏移不用除 2e7？
           *   因为形状纹理的采样是 position * shapeRepeat，
           *   位置单位是米，乘完 shapeRepeat 才是 UV。
           *   所以要让纹理在 UV 空间里移动 d 米，偏移量就是 d * shapeRepeat。
           *
           * 系数 0.3 / 0.2 是源库给的：云整体随风走，但内部结构走得慢一些。
           * 全用 1.0 的话，云会像贴纸一样整体平移，反而假。
           */
          windOffsets() {
            const p = this.params;
            if (!this._wind) {
              this._wind = {
                weather: new Cesium.Cartesian2(),
                shape: new Cesium.Cartesian3(),
                shapeDetail: new Cesium.Cartesian3(),
              };
            }
            if (!this._t0) this._t0 = performance.now();

            // 风的「时钟」。windTimeScale 只是把秒数放大，
            // 不改变风的物理 —— 调回 1 就是严格实时。
            const seconds =
              ((performance.now() - this._t0) / 1000) * p.windTimeScale;
            const distance = p.windSpeed * seconds;          // 风走了多少米
            const rad = Cesium.Math.toRadians(p.windDirection);
            const cx = Math.cos(rad) * distance;
            const cy = Math.sin(rad) * distance;

            // ① 天气图：米 → UV
            const wScale = p.weatherRepeat / 2.0e7;
            this._wind.weather.x = cx * wScale;
            this._wind.weather.y = cy * wScale;

            // ② 形状：米 → 纹理自身单位（乘 shapeRepeat）
            //    z 分量是「原地翻涌」，跟水平风无关，给个固定速率
            this._wind.shape.x = cx * p.shapeRepeat * 0.3;
            this._wind.shape.y = cy * p.shapeRepeat * 0.3;
            this._wind.shape.z = seconds * 0.2 * p.shapeRepeat;

            // ③ 细节：走得更慢，制造视差
            this._wind.shapeDetail.x = cx * p.shapeDetailRepeat * 0.2;
            this._wind.shapeDetail.y = cy * p.shapeDetailRepeat * 0.2;

            return this._wind;
          },

          async loadNoiseTextures() {
            try {
              const [shape, shapeDetail, weather, turbulence, stbn] = await Promise.all([
                this.loadVolumeTexture("./data/clouds/shape.bin", 128),
                this.loadVolumeTexture("./data/clouds/shape_detail.bin", 32),
                this.loadImageTexture("./data/clouds/local_weather.png"),
                this.loadImageTexture("./data/clouds/turbulence.png"),
                // ===== 本篇新增：时空蓝噪声 128×128×64（Z 轴 = 时间切片）=====
                this.loadVolumeTexture("./data/clouds/stbn.bin", 128, 128, 64),
              ]);
              this.volumeTextures.shape = shape;
              this.volumeTextures.shapeDetail = shapeDetail;
              this.volumeTextures.weather = weather;
              this.volumeTextures.turbulence = turbulence;
              this.volumeTextures.stbn = stbn;

              // ===== 本篇新增：大气 LUT =====
              // 尺寸必须和离线预计算时一致，改了就全错位
              const [transmittance, irradiance, scattering, higherOrder] = await Promise.all([
                this.loadAtmosphereLut("./data/clouds/atmosphere/transmittance.bin", 256, 64),
                this.loadAtmosphereLut("./data/clouds/atmosphere/irradiance.bin", 64, 16),
                this.loadAtmosphereLut("./data/clouds/atmosphere/scattering.bin", 256, 128, 32),
                this.loadAtmosphereLut("./data/clouds/atmosphere/higher_order_scattering.bin", 256, 128, 32),
              ]);
              this.volumeTextures.atmosphere.transmittance = transmittance;
              this.volumeTextures.atmosphere.irradiance = irradiance;
              this.volumeTextures.atmosphere.scattering = scattering;
              this.volumeTextures.atmosphere.higherOrder = higherOrder;
              console.log("[体积云02] 噪声纹理就绪", {
                shape: shape.width + "³",
                shapeDetail: shapeDetail.width + "³",
              });
            } catch (e) {
              console.error("[体积云02] 噪声纹理加载失败：", e);
            }
          },

          /**
           * ===== 本篇新增 =====
           * 密度场相关的 uniform —— 两个 pass 共用一份。
           *
           * 阴影图和主画面必须用完全相同的密度场，否则云影会和云对不上。
           * 与其抄两遍，不如写成一个方法，两边都 spread 进去。
           */
          densityUniforms() {
            const p = this.params;
            return {
              u_bottomRadius: () => BOTTOM_RADIUS,
              u_minHeight: () => p.baseHeight,
              u_maxHeight: () => p.baseHeight + p.thickness,
              u_densityScale: () => p.densityScale,
              u_coverage: () => p.coverage,

              shapeTexture: () => this.volumeTextures.shape,
              shapeDetailTexture: () => this.volumeTextures.shapeDetail,
              u_shapeRepeat: () => p.shapeRepeat,
              u_shapeDetailRepeat: () => p.shapeDetailRepeat,
              u_shapeAmount: () => p.shapeAmount,
              u_shapeDetailAmount: () => p.shapeDetailAmount,
              u_shapeAlteringBias: () => p.shapeAlteringBias,
              u_coverageFilterWidth: () => 0.6,
              u_profileLinear: () => p.profileLinear,
              u_profileConstant: () => p.profileConstant,

              localWeatherTexture: () => this.volumeTextures.weather,
              turbulenceTexture: () => this.volumeTextures.turbulence,
              u_weatherRepeat: () => p.weatherRepeat,
              u_weatherOffset: () => this.windOffsets().weather,
              u_weatherExponent: () => p.weatherExponent,
              u_useWeather: () => (p.useWeatherTexture ? 1 : 0),
              u_turbulenceRepeat: () => p.turbulenceRepeat,
              u_turbulenceDisplacement: () => p.turbulenceDisplacement,
              u_shapeOffset: () => this.windOffsets().shape,
              u_shapeDetailOffset: () => this.windOffsets().shapeDetail,

              // 阴影 pass 也要用到的两项
              u_sunDirection: () => this.computeSunDirection(),
              u_extinction: () => p.extinction,

              // 阴影图集的几何
              u_cascadeSize: () => this.cascadeSizeVec(),
              u_groundCenterSphere: () => this.computeGroundFrame().center,
              u_eastDir: () => this.computeGroundFrame().east,
              u_northDir: () => this.computeGroundFrame().north,
            };
          },

          /**
           * ===== 本篇新增 =====
           * 三个级联的边长。用不到的级联填 0 ——
           * 着色器里 `distH < size * 0.5` 对 0 永远不成立，
           * 会自动跳过，不用额外写分支。
           */
          cascadeSizeVec() {
            const p = this.params;
            if (!this._cascadeSize) this._cascadeSize = new Cesium.Cartesian3();
            const v = this._cascadeSize;
            const n = Math.max(1, Math.min(3, Math.round(p.shadowCascadeCount)));
            v.x = p.cascadeSize1;
            v.y = n >= 2 ? p.cascadeSize2 : 0;
            v.z = n >= 3 ? p.cascadeSize3 : 0;
            return v;
          },

          /**
           * ===== 本篇新增 =====
           * 阴影图的局部坐标系：以「相机正下方的地面点」为原点，
           * 东为 x、北为 y。
           *
           * 为什么不用 ECEF？因为级联是「以相机为中心、一圈圈放大」的，
           * 用相机脚下的局部坐标最自然，也省得每帧算一大堆矩阵。
           *
           * 返回的 center/east/north 都已经是**球坐标系**（减掉了云壳球心），
           * 和着色器里的 positionSphere 在同一套坐标下。
           */
          computeGroundFrame() {
            const viewer = this.viewer;
            if (!this._groundFrame) {
              this._groundFrame = {
                center: new Cesium.Cartesian3(),
                east: new Cesium.Cartesian3(),
                north: new Cesium.Cartesian3(),
                up: new Cesium.Cartesian3(),
                surface: new Cesium.Cartesian3(),
                sphereCenter: new Cesium.Cartesian3(),
              };
              this._groundCarto = new Cesium.Cartographic();
            }
            const g = this._groundFrame;
            const c = this._groundCarto;
            const camCarto = viewer.camera.positionCartographic;
            c.longitude = camCarto.longitude;
            c.latitude = camCarto.latitude;
            c.height = 0;

            // 地面点（ECEF）和它的法线
            Cesium.Cartographic.toCartesian(c, Cesium.Ellipsoid.WGS84, g.surface);
            Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(g.surface, g.up);

            // 东 = up × Z轴；北 = 东 × up
            Cesium.Cartesian3.cross(g.up, Cesium.Cartesian3.UNIT_Z, g.east);
            Cesium.Cartesian3.normalize(g.east, g.east);
            Cesium.Cartesian3.cross(g.east, g.up, g.north);
            Cesium.Cartesian3.normalize(g.north, g.north);

            // 换成球坐标系。
            // ⚠️ computeSphereCenter() 返回的是「相机在球坐标系里的位置」，
            //    不是球心本身 —— 球心 = 相机位置 - 它。
            //    一开始直接拿地面点减了它，结果 groundCenter 模长只有 2 万米，
            //    阴影图整个落在离地球 2 万米的地方，什么都采不到。
            const cameraSphere = this.computeSphereCenter();
            const camWC = viewer.camera.positionWC;
            const sphereCenterECEF = Cesium.Cartesian3.subtract(
              camWC, cameraSphere, g.sphereCenter);
            Cesium.Cartesian3.subtract(g.surface, sphereCenterECEF, g.center);
            return g;
          },

          addClouds() {
            const viewer = this.viewer;
            const p = this.params;

            // ===== 本篇新增：阴影 Pass =====
            this.shadowStage = new Cesium.PostProcessStage({
              name: "cloudShadowMap",
              fragmentShader: SHADOW_SHADER,
              uniforms: Object.assign(this.densityUniforms(), {
                u_shadowEnabled: () => (p.shadowsEnabled ? 1 : 0),
                u_shadowCascadeCount: () => p.shadowCascadeCount,
                u_shadowStepCount: () => p.shadowStepCount,
                u_shadowMaxDistance: () => p.shadowMaxDistance,
                u_shadowMinDensity: () => p.shadowMinDensity,
              }),
            });

            // ===== 本篇新增：云层改成「降分辨率渲染」=====
            // textureScale = 0.25 表示云只按 1/4 × 1/4 渲染，
            // 像素数是全分辨率的 1/16 —— 这是本篇省算力的主要来源。
            // pixelDatatype 用 HALF_FLOAT：累积要做多帧平均，
            // 8 位纹理的量化误差会在平均里积成一条条色阶。
            this.cloudStage = new Cesium.PostProcessStage({
              name: "volumetricClouds07",
              fragmentShader: CLOUD_SHADER,
              textureScale: p.renderScale,
              pixelDatatype: Cesium.PixelDatatype.HALF_FLOAT,
              uniforms: Object.assign(this.densityUniforms(), {
                // 相机在球坐标系里的位置
                u_cameraPositionSphere: () => this.computeSphereCenter(),
                u_cameraDirection: () => viewer.camera.directionWC,
                u_cameraRight: () => viewer.camera.rightWC,
                u_cameraUp: () => viewer.camera.upWC,
                u_tanHalfFov: () => this.tanHalfFov(),

                u_stepCount: () => p.stepCount,
                u_maxDistance: () => p.maxDistance,
                u_cloudColor: () =>
                  Cesium.Color.fromCssColorString(p.cloudColor),

                // ===== 场景遮挡 =====
                u_depthTestEnabled: () => (p.depthTest ? 1 : 0),
                u_occlusionBandScale: () => p.occlusionBandScale,
                u_debugSceneDepth: () => (p.debugSceneDepth ? 1 : 0),

                // ===== 光照 =====
                u_lightingEnabled: () => (p.lightingEnabled ? 1 : 0),
                // 注意：这里显式转成 Cartesian3 而不是直接传 Cesium.Color。
                // vec3 uniform 传 Color 在某些情况下拿不到值（实测 u_skyColor 会是 0），
                // 转成 Cartesian3 最稳妥。
                u_sunColor: () => this.hexToVec3(p.sunColor),
                u_skyColor: () => this.hexToVec3(p.skyColor),
                u_skyLightScale: () => p.skyLightScale,
                u_albedo: () => p.albedo,
                u_powderScale: () => p.powderScale,
                u_powderExponent: () => p.powderExponent,
                u_multiScatterOctaves: () => p.multiScatterOctaves,
                u_exposure: () => p.exposure,
                u_sunStepCount: () => p.sunStepCount,
                u_sunStepSize: () => p.sunStepSize,
                u_sunStepScale: () => p.sunStepScale,
                u_lightDebug: () => p.lightDebug,

                // ===== 本篇新增：阴影图读取端 =====
                // 用 getter 取 —— 阴影 stage 先执行，轮到云 stage 时纹理已经在了。
                shadowBuffer: () => this.shadowStage.outputTexture,
                u_shadowsEnabled: () => (p.shadowsEnabled ? 1 : 0),
                u_shadowCascadeCount: () => p.shadowCascadeCount,
                u_shadowTexelSize: () =>
                  p.shadowCascadeCount / viewer.scene.drawingBufferWidth,
                u_shadowIntensity: () => p.shadowIntensity,
                u_shadowBlur: () => p.shadowBlur,
                u_castShadowOnScene: () => (p.castShadowOnScene ? 1 : 0),
                u_shadowOnSceneIntensity: () => p.shadowOnSceneIntensity,
                u_shadowDebug: () => p.shadowDebug,

                // ===== 本篇新增：抖动 =====
                u_jitter: () => this.jitterOffset(),
                u_stepJitter: () => this.stepJitter(),

                // ===== 本篇新增：时空蓝噪声 =====
                // 纹理加载失败时退回 shapeTexture —— 反正 u_useSTBN 会是 0，
                // 这个采样器根本不会被采到，但 uniform 必须有东西可绑。
                stbnTexture: () =>
                  this.volumeTextures.stbn || this.volumeTextures.shape,
                u_stbnFrame: () => this.frameIndex,
                u_useSTBN: () =>
                  p.stbnEnabled && this.volumeTextures.stbn ? 1 : 0,

                // ===== 本篇新增：大气 LUT =====
                transmittanceTexture: () => this.volumeTextures.atmosphere.transmittance,
                irradianceTexture: () => this.volumeTextures.atmosphere.irradiance,
                scatteringTexture: () => this.volumeTextures.atmosphere.scattering,
                higherOrderScatteringTexture: () =>
                  this.volumeTextures.atmosphere.higherOrder,
                u_atmosphereEnabled: () => (p.atmosphereEnabled ? 1 : 0),
                u_sunIrradianceScale: () => p.sunIrradianceScale,
                u_skyIrradianceScale: () => p.skyIrradianceScale,
                u_atmoDebug: () => p.atmoDebug,
                // 空气透视搬到了这一层，这几个开关也要跟着过来
                u_aerialPerspective: () => (p.aerialPerspective ? 1 : 0),
                u_lightShafts: () => (p.lightShafts ? 1 : 0),
                u_aerialScale: () => p.aerialScale,
                u_inscatterHueFix: () => (p.inscatterHueFix ? 1 : 0),
              }),
            });

            // ===== 本篇新增：composite 交给 buildTemporal 一起建 =====
            // 07 的 composite 是三个 stage：阴影 → 云层（低分辨率）→ 时间累积合成。
            // 建它的时候要顺手把累积缓冲、重投影要用的相机基底都准备好，
            // 所以统一挪到 buildTemporal 里。
            this.buildTemporal();
          },

          // ============================================================
          // ===== 本篇新增：时间累积 =====
          // ============================================================

          /** 相机视锥的 tan(半 FOV)，重投影要用 */
          tanHalfFov() {
            const f = this.viewer.camera.frustum;
            const tanY = Math.tan(f.fovy * 0.5);
            if (!this._tanHalfFov) this._tanHalfFov = new Cesium.Cartesian2();
            this._tanHalfFov.x = tanY * f.aspectRatio;
            this._tanHalfFov.y = tanY;
            return this._tanHalfFov;
          },

          /** 低分辨率云层的像素尺寸（和 PostProcessStage 内部算法保持一致） */
          lowResSize() {
            const scene = this.viewer.scene;
            const s = Math.max(0.01, Math.min(1, this.params.renderScale));
            if (!this._lowRes) this._lowRes = new Cesium.Cartesian2();
            this._lowRes.x = Math.max(1, Math.ceil(scene.drawingBufferWidth * s));
            this._lowRes.y = Math.max(1, Math.ceil(scene.drawingBufferHeight * s));
            return this._lowRes;
          },

          /**
           * 亚像素抖动：把视线在低分辨率像素内部挪一个亚像素位置。
           *
           * 把 16 个 Bayer 相位铺成 4×4 的格，相位 v 对应格点
           * ((v%4)/4, (v>>2)/4)，再映射到 [-0.5, 0.5) 个低分辨率像素，
           * 最后除以低分辨率尺寸换成 UV 偏移。
           */
          jitterOffset() {
            if (!this._jit) this._jit = new Cesium.Cartesian2();
            if (!this.params.jitterEnabled) {
              this._jit.x = 0;
              this._jit.y = 0;
              return this._jit;
            }
            const v = bayerPhase(this.frameIndex);
            const size = this.lowResSize();
            const gx = ((v & 3) + 0.5) / 4 - 0.5;
            const gy = ((v >> 2) + 0.5) / 4 - 0.5;
            this._jit.x = gx / size.x;
            this._jit.y = gy / size.y;
            return this._jit;
          },

          /**
           * 步进相位抖动：第一步从步长的哪个位置开始走。
           *
           * 这一项才是治条带的：固定从 0.5 步长处开始采样，
           * 误差在屏幕上表现为一层层的同心条带；把相位打散成噪声之后，
           * 时间累积才能把它平均掉。
           */
          stepJitter() {
            if (!this.params.jitterEnabled) return 0.5;
            return (bayerPhase(this.frameIndex) + 0.5) / 16.0;
          },

          /** 记录本帧的相机基底，供下一帧做重投影 */
          captureCamera() {
            const cam = this.viewer.camera;
            const posSphere = this.computeSphereCenter();
            const centerEcef = Cesium.Cartesian3.subtract(
              cam.positionWC,
              posSphere,
              new Cesium.Cartesian3(),
            );
            const tan = this.tanHalfFov();
            return {
              camEcef: Cesium.Cartesian3.clone(cam.positionWC),
              centerEcef,
              dir: Cesium.Cartesian3.clone(cam.directionWC),
              right: Cesium.Cartesian3.clone(cam.rightWC),
              up: Cesium.Cartesian3.clone(cam.upWC),
              tan: new Cesium.Cartesian2(tan.x, tan.y),
            };
          },

          /**
           * 上一帧的相机位置，重新表达在**当前帧的球坐标系**里。
           *
           * 球心跟着相机走（永远是相机正下方 6360 km 处），所以不能
           * 直接把上一帧的位置拿来用 —— 得先减去当前的球心。
           */
          prevCameraPositionSphere() {
            const cam = this.viewer.camera;
            if (!this._tmpCenter) {
              this._tmpCenter = new Cesium.Cartesian3();
              this._tmpPrevPos = new Cesium.Cartesian3();
            }
            if (!this.prevCam) return this.computeSphereCenter();
            const centerNow = Cesium.Cartesian3.subtract(
              cam.positionWC,
              this.computeSphereCenter(),
              this._tmpCenter,
            );
            return Cesium.Cartesian3.subtract(
              this.prevCam.camEcef,
              centerNow,
              this._tmpPrevPos,
            );
          },

          /** 时间累积 Pass 的 uniform */
          temporalUniforms() {
            const p = this.params;
            return {
              colorBuffer: () => this.cloudStage && this.cloudStage.outputTexture,
              historyBuffer: () => this.history && this.history.read.texture,
              u_lowResTexel: () => {
                const s = this.lowResSize();
                if (!this._lowResTexel) this._lowResTexel = new Cesium.Cartesian2();
                this._lowResTexel.x = 1 / s.x;
                this._lowResTexel.y = 1 / s.y;
                return this._lowResTexel;
              },
              u_temporalAlpha: () => (this.resetHistory ? 1.0 : p.temporalAlpha),
              u_varianceGamma: () => p.varianceGamma,
              u_debug: () => p.temporalDebug,
              u_camPos: () => this.computeSphereCenter(),
              u_camDir: () => this.viewer.camera.directionWC,
              u_camRight: () => this.viewer.camera.rightWC,
              u_camUp: () => this.viewer.camera.upWC,
              u_tanHalfFov: () => this.tanHalfFov(),
              u_prevCamPos: () => this.prevCameraPositionSphere(),
              u_prevCamDir: () =>
                this.prevCam ? this.prevCam.dir : this.viewer.camera.directionWC,
              u_prevCamRight: () =>
                this.prevCam ? this.prevCam.right : this.viewer.camera.rightWC,
              u_prevCamUp: () =>
                this.prevCam ? this.prevCam.up : this.viewer.camera.upWC,
              u_prevTanHalfFov: () =>
                this.prevCam ? this.prevCam.tan : this.tanHalfFov(),
              // 云壳中面半径，给重投影当「深度」用
              u_shellRadius: () =>
                BOTTOM_RADIUS + p.baseHeight + p.thickness * 0.5,
            };
          },

          /** 建累积缓冲 + 时间累积 Pass + 合成 Stage，并重装 composite */
          buildTemporal() {
            const viewer = this.viewer;
            const p = this.params;
            const context = viewer.scene.context;

            this.destroyHistory();

            const w = Math.max(1, viewer.scene.drawingBufferWidth);
            const h = Math.max(1, viewer.scene.drawingBufferHeight);
            const pixelDatatype = Cesium.PixelDatatype.HALF_FLOAT;

            // ① 两张全分辨率累积缓冲，ping-pong
            const read = new RenderTarget(context, { width: w, height: h, pixelDatatype });
            const write = new RenderTarget(context, { width: w, height: h, pixelDatatype });
            this.history = Vue.markRaw({
              read,
              write,
              swap() {
                const t = this.read;
                this.read = this.write;
                this.write = t;
              },
            });

            // ② 时间累积：渲染到 write
            this.temporalPass = Vue.markRaw(
              new FullscreenPass(context, {
                fragmentShader: TEMPORAL_SHADER,
                framebuffer: this.history.write.framebuffer,
                width: w,
                height: h,
                uniforms: this.temporalUniforms(),
              }),
            );

            // ③ 合成 Stage：把累积结果盖到场景上（地面云影也在这里做）
            this.resolveStage = new Cesium.PostProcessStage({
              name: "cloudResolve07",
              fragmentShader: RESOLVE_SHADER,
              // densityUniforms 里已经有 u_bottomRadius / u_sunDirection /
              // 地面坐标系 / 级联边长这些，地面云影正好都要用
              uniforms: Object.assign(this.densityUniforms(), {
                cloudBuffer: () => this.cloudStage && this.cloudStage.outputTexture,
                historyBuffer: () => this.history && this.history.read.texture,
                u_temporalEnabled: () => (p.temporalEnabled ? 1 : 0),
                u_temporalDebug: () => p.temporalDebug,

                // ===== 本篇新增：地面云影的 uniform =====
                // 云影从云层 Pass 搬到了这一层，相关的 uniform 也要跟过来。
                shadowBuffer: () => this.shadowStage.outputTexture,
                u_shadowsEnabled: () => (p.shadowsEnabled ? 1 : 0),
                u_shadowCascadeCount: () => p.shadowCascadeCount,
                u_shadowTexelSize: () =>
                  p.shadowCascadeCount / viewer.scene.drawingBufferWidth,
                u_shadowIntensity: () => p.shadowIntensity,
                u_shadowBlur: () => p.shadowBlur,
                u_castShadowOnScene: () => (p.castShadowOnScene ? 1 : 0),
                u_shadowOnSceneIntensity: () => p.shadowOnSceneIntensity,
                u_cameraPositionSphere: () => this.computeSphereCenter(),
                u_cameraDirection: () => viewer.camera.directionWC,
                u_cameraRight: () => viewer.camera.rightWC,
                u_cameraUp: () => viewer.camera.upWC,
                u_tanHalfFov: () => this.tanHalfFov(),

                // ===== 本篇新增：空气透视 + 光束 =====
                transmittanceTexture: () => this.volumeTextures.atmosphere.transmittance,
                irradianceTexture: () => this.volumeTextures.atmosphere.irradiance,
                scatteringTexture: () => this.volumeTextures.atmosphere.scattering,
                higherOrderScatteringTexture: () =>
                  this.volumeTextures.atmosphere.higherOrder,
                u_atmosphereEnabled: () => (p.atmosphereEnabled ? 1 : 0),
                u_aerialPerspective: () => (p.aerialPerspective ? 1 : 0),
                u_lightShafts: () => (p.lightShafts ? 1 : 0),
                u_aerialScale: () => p.aerialScale,
                u_inscatterHueFix: () => (p.inscatterHueFix ? 1 : 0),
                u_sunDirection: () => this.computeSunDirection(),

                // ===== 修正：曝光 + 色调映射（对齐源库 ResolvePass）=====
                u_exposure: () => p.exposure,
                u_cloudContrast: () => p.cloudContrast,
              }),
            });

            // ④ 组装 composite：阴影 → 云层（低分辨率）→ 时间累积合成
            // ⚠️ composite 的名字必须和里面 stage 的名字**都不一样**：
            //    Cesium 取「最终输出纹理」时会按名字 getStageByName，
            //    它会一路搜到嵌套 stage —— 重名的话会拿到里面那个 stage
            //    的输出，外面这层 composite 的结果就被丢掉了。
            this.cloudComposite = new Cesium.PostProcessStageComposite({
              name: "volumetricClouds07Composite",
              stages: [this.shadowStage, this.cloudStage, this.resolveStage],
              // false = 每个 stage 都读**原始场景纹理**。默认的 true 会让
              // 后一个 stage 拿前一个的输出当输入，画面就只剩阴影图了。
              inputPreviousStageTexture: false,
            });
            viewer.scene.postProcessStages.add(this.cloudComposite);

            this.resetHistory = true;
            this.frameIndex = 0;

            // ⑤ postRender 里跑时间累积 —— 这时候本帧的云层已经渲染完了
            if (!this._postRenderRemover) {
              this._postRenderRemover = viewer.scene.postRender.addEventListener(() =>
                this.runTemporal(),
              );
            }
          },

          /** 每帧一次：把当前帧的云层混合进累积缓冲 */
          runTemporal() {
            const viewer = this.viewer;
            const scene = viewer.scene;
            if (!this.history || !this.temporalPass) return;

            // 窗口尺寸变了，累积缓冲得按新尺寸重建
            if (
              this.history.read.width !== scene.drawingBufferWidth ||
              this.history.read.height !== scene.drawingBufferHeight
            ) {
              this.rebuildAll();
              return;
            }

            const stage = this.cloudStage;
            if (!stage || !stage.outputTexture) return;

            this.resetHistory = this.needResetHistory();
            try {
              this.temporalPass.execute();
            } catch (e) {
              if (!this._temporalErr) {
                this._temporalErr = true;
                console.error("时间累积 Pass 执行失败：", e);
              }
              return;
            }
            this.history.swap();
            this.temporalPass.setFramebuffer(this.history.write.framebuffer);

            this.prevCam = this.captureCamera();
            this.frameIndex++;
          },

          /**
           * 什么时候必须把历史整片作废？
           *   - 参数改了（云本身变了，历史对不上）
           *   - 相机瞬移（重置视角、跳时间）—— 逐帧位移很大
           * 注意：相机**连续移动**不算，那正是重投影要处理的场景。
           */
          needResetHistory() {
            const p = this.params;
            const key = JSON.stringify([
              p.renderScale, p.jitterEnabled, p.stbnEnabled, p.varianceGamma, p.temporalEnabled,
              p.stepCount, p.coverage, p.baseHeight, p.thickness, p.densityScale,
              p.weatherRepeat, p.useWeatherTexture, p.shadowsEnabled,
              p.lightingEnabled, p.exposure, p.windSpeed, p.timePreset,
            ]);
            if (key !== this._paramKey) {
              this._paramKey = key;
              return true;
            }
            if (!this.prevCam) return true;
            const cam = this.viewer.camera;
            if (Cesium.Cartesian3.distance(cam.positionWC, this.prevCam.camEcef) > 500) {
              return true;
            }
            const cosLimit = Math.cos(Cesium.Math.toRadians(8));
            if (Cesium.Cartesian3.dot(cam.directionWC, this.prevCam.dir) < cosLimit) {
              return true;
            }
            return false;
          },

          /** 只销毁 GPU 资源，不动 composite */
          destroyHistory() {
            if (this.history) {
              this.history.read.destroy();
              this.history.write.destroy();
              this.history = null;
            }
            if (this.temporalPass) {
              this.temporalPass.destroy();
              this.temporalPass = null;
            }
          },

          /**
           * 拆掉 07 加的这一整套（composite / 云层 Stage / 累积缓冲）。
           *
           * ⚠️ 有个坑：Cesium 的 PostProcessStageComposite.destroy()
           * **会连带销毁它里面的 stage**。而重建时 shadowStage 这些还要接着用，
           * 所以先把 composite 的 stage 列表摘空，再销毁它自己。
           */
          disposeAll() {
            const viewer = this.viewer;
            if (!viewer) return;
            if (this.cloudComposite) {
              this.cloudComposite._stages = [];
              viewer.scene.postProcessStages.remove(this.cloudComposite);
              this.cloudComposite.destroy();
              this.cloudComposite = null;
            }
            for (const key of ["shadowStage", "cloudStage", "resolveStage"]) {
              if (this[key]) {
                this[key].destroy();
                this[key] = null;
              }
            }
            this.destroyHistory();
            this.prevCam = null;
            this._paramKey = null;
          },

          /**
           * 改渲染分辨率要整套重建 ——
           * PostProcessStage 的 textureScale 是只读的，改不了。
           */
          rebuildAll() {
            if (!this.viewer) return;
            this.disposeAll();
            this.addClouds();
          },

          resetCamera() {
            this.applyCameraPreset("overview");
          },

          /**
           * ===== 本篇新增：相机预设 =====
           *
           * 为什么非要加一个「云下视角」？
           *
           * 空气透视和丁达尔光都依赖「视线路径上有没有被云挡过」。
           * 默认的 7 km 俯视里，视线刚碰到云的前表面就结束了，
           * 中间那一小段几乎没被别的云挡过 —— 所以出不来光柱。
           *
           * 降到云层下方（800 m，云底在 1200 m）朝太阳仰视，
           * 光从云缝里漏下来，才是丁达尔光经典的样子。
           */
          applyCameraPreset(name) {
            if (!this.viewer) return;
            if (name === "belowClouds") {
              // 朝向太阳，让云缝正好逆光
              this.viewer.camera.setView({
                destination: Cesium.Cartesian3.fromDegrees(116.4, 39.9, 800),
                orientation: {
                  heading: this.sunAzimuth(),
                  // 平视稍抬，既看得到云层、也看得到地平线那条大气散射的光带
                  pitch: Cesium.Math.toRadians(4),
                  roll: 0,
                },
              });
            } else {
              this.viewer.camera.setView({
                destination: Cesium.Cartesian3.fromDegrees(116.4, 39.9, 7000),
                orientation: {
                  heading: Cesium.Math.toRadians(0),
                  pitch: Cesium.Math.toRadians(-17),
                  roll: 0,
                },
              });
            }
          },

          /** 把太阳方向投到本地 ENU，算出「朝北顺时针」的方位角（弧度） */
          sunAzimuth() {
            const origin = Cesium.Cartesian3.fromDegrees(116.4, 39.9, 800);
            const enu = Cesium.Transforms.eastNorthUpToFixedFrame(origin);
            const inv = Cesium.Matrix4.inverseTransformation(enu, new Cesium.Matrix4());
            const local = Cesium.Matrix4.multiplyByPointAsVector(
              inv, this.computeSunDirection(), new Cesium.Cartesian3());
            return Math.atan2(local.x, local.y);
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
