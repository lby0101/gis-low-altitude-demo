<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>叠加分析</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.140.0/Build/Cesium/Cesium.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/cesium@1.140.0/Build/Cesium/Widgets/widgets.css"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #app,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
      }

      .lil-gui {
        top: 10px;
        left: 10px;
        z-index: 999;
      }

      .status-panel {
        position: absolute;
        left: 10px;
        bottom: 10px;
        z-index: 998;
        min-width: 300px;
        max-width: calc(100vw - 40px);
        padding: 10px 12px;
        border-radius: 6px;
        color: #e8f1ff;
        background: rgba(12, 18, 28, 0.78);
        font-size: 13px;
        line-height: 1.7;
        pointer-events: none;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="cesiumContainer"></div>
      <div class="status-panel">{{ statusText }}</div>
    </div>

    <script type="module">
      const { createApp } = Vue;
      import GUI from "https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.js";

      // 两个待叠加分析的面，坐标顺序为 [经度, 纬度]
      const POLYGON_1 = [
        [117.182288, 31.854164],
        [117.210254, 31.878324],
        [117.238229, 31.855796],
        [117.242307, 31.826109],
        [117.177277, 31.821475],
        [117.182288, 31.854164],
      ];
      const POLYGON_2 = [
        [117.267046, 31.842971],
        [117.20963, 31.840323],
        [117.230646, 31.787122],
        [117.28833, 31.799624],
        [117.267046, 31.842971],
      ];

      createApp({
        data() {
          return {
            viewer: null,
            imageryLayer: null,
            terrainProvider: null,
            myLilGui: null,
            polygon1Entity: null,
            polygon2Entity: null,
            intersectionDataSource: null,
            areaLabelEntity: null,
            intersectionFeature: null,
            statusText: "正在初始化叠加分析…",
            params: {
              polygon1Color: "#ff3b30",
              polygon1Opacity: 0.5,
              polygon2Color: "#34c759",
              polygon2Opacity: 0.5,
              intersectionColor: "#2979ff",
              intersectionOpacity: 0.78,
              showPolygon1: true,
              showPolygon2: true,
              showIntersection: true,
              showLabel: true,
              calculate: () => this.calculateIntersection(),
              clear: () => this.clearIntersection(),
              resetCamera: () => this.resetCamera(),
            },
          };
        },

        async mounted() {
          this.initMap();
          this.addBasePolygons();
          this.addlilgui();
          await this.initTerrain();
          await this.calculateIntersection();
        },

        beforeUnmount() {
          if (this.myLilGui) {
            this.myLilGui.destroy();
            this.myLilGui = null;
          }
          this.clearIntersection();
          if (this.viewer) {
            this.viewer.destroy();
            this.viewer = null;
          }
        },

        methods: {
          initMap() {
            const viewer = new Cesium.Viewer("cesiumContainer", {
              baseLayer: false,
              animation: false,
              timeline: false,
              fullscreenButton: false,
              infoBox: false,
              geocoder: false,
              homeButton: false,
              sceneModePicker: false,
              baseLayerPicker: false,
              navigationHelpButton: false,
              selectionIndicator: false,
              shouldAnimate: true,
            });

            window.viewer = viewer;
            this.viewer = viewer;
            viewer.scene.debugShowFramesPerSecond = true;
            viewer.scene.globe.depthTestAgainstTerrain = true;
            viewer.scene.globe.enableLighting = false;
            viewer.scene.fog.enabled = true;
            viewer.scene.fog.density = 0.00008;
            viewer.scene.skyAtmosphere.show = true;
            viewer._cesiumWidget._creditContainer.style.display = "none";

            this.imageryLayer = viewer.imageryLayers.addImageryProvider(
              new Cesium.UrlTemplateImageryProvider({
                url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                maximumLevel: 18,
              }),
            );
            this.resetCamera();
          },

          async initTerrain() {
            try {
              this.statusText = "正在加载地形…";
              this.terrainProvider =
                await Cesium.ArcGISTiledElevationTerrainProvider.fromUrl(
                  "https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer",
                );
              this.viewer.terrainProvider = this.terrainProvider;
              this.statusText = "地形加载完成，正在计算相交区域…";
            } catch (error) {
              console.warn("地形加载失败，将使用椭球面显示：", error);
              this.statusText = "地形加载失败，正在使用椭球面计算…";
            }
          },

          addBasePolygons() {
            this.polygon1Entity = this.viewer.entities.add({
              id: "overlay-polygon-1",
              polygon: {
                hierarchy: Cesium.Cartesian3.fromDegreesArray(
                  POLYGON_1.flat(),
                ),
                material: this.getColorMaterial(
                  this.params.polygon1Color,
                  this.params.polygon1Opacity,
                ),
                outline: true,
                outlineColor: Cesium.Color.WHITE.withAlpha(0.9),
                outlineWidth: 2,
                classificationType: Cesium.ClassificationType.TERRAIN,
              },
            });

            this.polygon2Entity = this.viewer.entities.add({
              id: "overlay-polygon-2",
              polygon: {
                hierarchy: Cesium.Cartesian3.fromDegreesArray(
                  POLYGON_2.flat(),
                ),
                material: this.getColorMaterial(
                  this.params.polygon2Color,
                  this.params.polygon2Opacity,
                ),
                outline: true,
                outlineColor: Cesium.Color.WHITE.withAlpha(0.9),
                outlineWidth: 2,
                classificationType: Cesium.ClassificationType.TERRAIN,
              },
            });
          },

          addlilgui() {
            const gui = new GUI({ title: "叠加分析" });
            this.myLilGui = gui;

            const operationFolder = gui.addFolder("分析操作");
            operationFolder
              .add(this.params, "calculate")
              .name("重新分析");
            operationFolder.add(this.params, "clear").name("清除相交结果");
            operationFolder
              .add(this.params, "resetCamera")
              .name("重置视角");

            const styleFolder = gui.addFolder("图层样式");
            styleFolder
              .addColor(this.params, "polygon1Color")
              .name("区域一颜色")
              .onChange(() => this.updateBasePolygonStyle());
            styleFolder
              .add(this.params, "polygon1Opacity", 0, 1, 0.01)
              .name("区域一透明度")
              .onChange(() => this.updateBasePolygonStyle());
            styleFolder
              .addColor(this.params, "polygon2Color")
              .name("区域二颜色")
              .onChange(() => this.updateBasePolygonStyle());
            styleFolder
              .add(this.params, "polygon2Opacity", 0, 1, 0.01)
              .name("区域二透明度")
              .onChange(() => this.updateBasePolygonStyle());
            styleFolder
              .addColor(this.params, "intersectionColor")
              .name("相交区域颜色")
              .onChange(() => this.updateIntersectionStyle());
            styleFolder
              .add(this.params, "intersectionOpacity", 0, 1, 0.01)
              .name("相交区域透明度")
              .onChange(() => this.updateIntersectionStyle());

            const visibilityFolder = gui.addFolder("显示控制");
            visibilityFolder
              .add(this.params, "showPolygon1")
              .name("显示区域一")
              .onChange((value) => {
                if (this.polygon1Entity) this.polygon1Entity.show = value;
              });
            visibilityFolder
              .add(this.params, "showPolygon2")
              .name("显示区域二")
              .onChange((value) => {
                if (this.polygon2Entity) this.polygon2Entity.show = value;
              });
            visibilityFolder
              .add(this.params, "showIntersection")
              .name("显示相交区域")
              .onChange((value) => {
                if (this.intersectionDataSource)
                  this.intersectionDataSource.show = value;
              });
            visibilityFolder
              .add(this.params, "showLabel")
              .name("显示面积标签")
              .onChange((value) => {
                if (this.areaLabelEntity) this.areaLabelEntity.show = value;
              });

            const layerFolder = gui.addFolder("影像图层");
            layerFolder.add(this.imageryLayer, "show").name("显示影像");
            layerFolder
              .add(this.imageryLayer, "alpha", 0, 1, 0.01)
              .name("影像透明度");
          },

          getColorMaterial(color, alpha) {
            return Cesium.Color.fromCssColorString(color).withAlpha(alpha);
          },

          updateBasePolygonStyle() {
            if (this.polygon1Entity) {
              this.polygon1Entity.polygon.material = this.getColorMaterial(
                this.params.polygon1Color,
                this.params.polygon1Opacity,
              );
            }
            if (this.polygon2Entity) {
              this.polygon2Entity.polygon.material = this.getColorMaterial(
                this.params.polygon2Color,
                this.params.polygon2Opacity,
              );
            }
          },

          updateIntersectionStyle() {
            if (!this.intersectionDataSource) return;
            const material = this.getColorMaterial(
              this.params.intersectionColor,
              this.params.intersectionOpacity,
            );
            this.intersectionDataSource.entities.values.forEach((entity) => {
              if (entity.polygon) {
                entity.polygon.material = material;
                entity.polygon.outline = true;
                entity.polygon.outlineColor = Cesium.Color.WHITE.withAlpha(
                  0.95,
                );
              }
            });
          },

          async calculateIntersection() {
            if (!this.viewer || !window.turf) return;
            this.clearIntersection();
            this.statusText = "正在计算两个多边形的相交区域…";

            try {
              const polygon1 = turf.polygon([POLYGON_1]);
              const polygon2 = turf.polygon([POLYGON_2]);
              // Turf 7 使用 FeatureCollection 传入多个待求交要素。
              const intersection = turf.intersect(
                turf.featureCollection([polygon1, polygon2]),
              );

              if (!intersection) {
                this.statusText = "两个区域没有相交部分。";
                return;
              }

              this.intersectionFeature = intersection;
              this.intersectionDataSource = await Cesium.GeoJsonDataSource.load(
                intersection,
                {
                  clampToGround: true,
                  fill: this.getColorMaterial(
                    this.params.intersectionColor,
                    this.params.intersectionOpacity,
                  ),
                  stroke: Cesium.Color.WHITE.withAlpha(0.95),
                  strokeWidth: 2,
                },
              );
              this.intersectionDataSource.show =
                this.params.showIntersection;
              this.viewer.dataSources.add(this.intersectionDataSource);
              this.updateIntersectionStyle();

              const area = turf.area(intersection);
              const center = turf.pointOnFeature(intersection).geometry
                .coordinates;
              this.areaLabelEntity = this.viewer.entities.add({
                id: "overlay-intersection-area",
                position: Cesium.Cartesian3.fromDegrees(center[0], center[1]),
                label: {
                  text: `相交部分\n${this.formatArea(area)}`,
                  color: Cesium.Color.WHITE,
                  font: "18px sans-serif",
                  style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                  outlineColor: Cesium.Color.BLACK,
                  outlineWidth: 3,
                  showBackground: true,
                  backgroundColor: Cesium.Color.BLACK.withAlpha(0.55),
                  horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
                  verticalOrigin: Cesium.VerticalOrigin.TOP,
                  heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                  disableDepthTestDistance: Number.POSITIVE_INFINITY,
                },
                show: this.params.showLabel,
              });

              this.statusText = `分析完成：相交面积 ${this.formatArea(area)}。`;
            } catch (error) {
              console.error("叠加分析失败：", error);
              this.statusText = `叠加分析失败：${error.message}`;
            }
          },

          formatArea(area) {
            return area >= 10000
              ? `${(area / 10000).toFixed(2)} 公顷`
              : `${area.toFixed(2)} 平方米`;
          },

          clearIntersection() {
            if (this.intersectionDataSource && this.viewer) {
              this.viewer.dataSources.remove(
                this.intersectionDataSource,
                true,
              );
            }
            this.intersectionDataSource = null;
            this.intersectionFeature = null;
            if (this.areaLabelEntity && this.viewer) {
              this.viewer.entities.remove(this.areaLabelEntity);
            }
            this.areaLabelEntity = null;
          },

          resetCamera() {
            if (!this.viewer) return;
            this.viewer.camera.setView({
              destination: Cesium.Cartesian3.fromDegrees(
                117.225959,
                31.705235,
                18000,
              ),
              orientation: {
                heading: Cesium.Math.toRadians(0),
                pitch: Cesium.Math.toRadians(-50),
                roll: 0,
              },
            });
          },
        },
      }).mount("#app");
    </script>
  </body>
</html>
